<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LLM検証（切り分け）</title>
<style>
  body{ font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; margin:0; padding:calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); background:#0d1117; color:#eef2f7; }
  h1{ font-size:19px; margin:0 0 6px; }
  p.note{ color:#93a1b3; font-size:13.5px; line-height:1.7; }
  .rowline{ font-size:15px; line-height:1.8; border-bottom:1px solid #26303f; padding:8px 0; }
  .ok{ color:#6ee7a0; font-weight:700; } .ng{ color:#fda4af; font-weight:700; } .warn{ color:#fcd34d; font-weight:700; }
  .modelrow{ padding:12px 14px; margin-top:10px; border-radius:12px; border:1px solid #26303f; background:#161c26; font-size:15.5px; }
  .modelrow small{ display:block; color:#93a1b3; font-size:12.5px; margin-top:3px; }
  .modelrow .st{ font-size:13.5px; margin-top:6px; }
  .modelrow.active{ border-color:#7dd3fc; }
  button.big{ width:100%; padding:15px; border-radius:12px; border:0; background:#7dd3fc; color:#082f49; font-size:16px; font-weight:700; margin-top:16px; cursor:pointer; }
  button.big[disabled]{ opacity:.5; }
  button.sub{ width:100%; padding:12px; border-radius:12px; border:1px solid #26303f; background:#161c26; color:#eef2f7; font-size:14.5px; margin-top:10px; cursor:pointer; }
  #copyBtn{ width:100%; padding:14px; border-radius:12px; border:0; background:#7dd3fc; color:#082f49; font-size:16px; font-weight:700; margin-bottom:10px; cursor:pointer; }
  pre#out{ white-space:pre-wrap; word-break:break-word; font-size:13.5px; line-height:1.75; background:#161c26; border:1px solid #26303f; border-radius:12px; padding:12px; min-height:60px; }
  pre#log{ white-space:pre-wrap; word-break:break-word; font-size:12px; line-height:1.7; background:#0a0e14; border:1px solid #26303f; border-radius:12px; padding:12px; max-height:320px; overflow-y:auto; }
  .bar{ height:10px; border-radius:6px; background:#26303f; overflow:hidden; margin-top:8px; }
  .bar > div{ height:100%; width:0%; background:#7dd3fc; transition:width .2s; }
  h2{ font-size:15px; margin:20px 0 4px; color:#93a1b3; }
</style>
<style>html{touch-action:manipulation;}</style><script>document.addEventListener('gesturestart',function(e){e.preventDefault();});</script>
</head>
<body>
<h1>LLM検証（端末の中で動くか）</h1>
<button id="copyBtn" type="button">結果とログをコピー</button>
<div id="copyMsg" style="font-size:13px;color:#7dd3fc;min-height:18px;"></div>
<div class="rowline" id="envGpu">WebGPU: 確認中…</div>
<div class="rowline" id="envAdapter">アダプタ: —</div>
<p class="note">ボタンを1つ押すと、大きいモデルから順に「ダウンロード→読み込み→測定」を自動で試します。失敗したり画面ごと落ちたら、次の小さいモデルへ自動で切り替えます。落ちて画面が閉じても、もう一度このページを開けば、落ちた所から自動で続きを始めます。記録（ログ）は端末に残るので、落ちた時も後から読めます。</p>

<div id="board"></div>
<button id="startBtn" class="big" type="button">測定をはじめる（大きい順に自動）</button>
<button id="stopBtn" class="sub" type="button" style="display:none;">止める</button>
<div class="bar"><div id="barFill"></div></div>
<div class="rowline" id="progress">進み具合: —</div>
<pre id="out">結果はここに出ます。</pre>
<h2>記録（ログ）</h2>
<button id="logCopyBtn" class="sub" type="button" style="margin:0 0 8px;">ログをコピー</button>
<pre id="log">（まだありません）</pre>

<script type="module">
const MODELS = [
  { id: 'Qwen3-8B-q4f16_1-MLC', label: 'Qwen3-8B（挑戦枠）', note: '約4.7GB。性能は一番高い。端末の上限を探る' },
  { id: 'Qwen3-4B-q4f16_1-MLC', label: 'Qwen3-4B（基準）', note: '約2.5GB。自宅のディナと同じ系統' },
  { id: 'Qwen3-1.7B-q4f16_1-MLC', label: 'Qwen3-1.7B', note: '約1.2GB。受け皿' },
  { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', label: 'Qwen2.5-0.5B', note: '約0.3GB。Spaceでは52 tok/sの実績' },
];
const LOG_KEY = 'llmprobe.log.v2';
const RUN_KEY = 'llmprobe.run.v2';
let webllm = null;
let envText = '';
let stopRequested = false;
let chainRunning = false;

// ---------- 記録（ログ）：その都度 端末へ保存する。画面ごと落ちても最後の一歩まで残る ----------
function loadLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); }catch(e){ return []; } }
function renderLog(){
  const lines = loadLog();
  const el = document.getElementById('log');
  el.textContent = lines.length ? lines.join('\n') : '（まだありません）';
  el.scrollTop = el.scrollHeight;
}
function log(msg){
  const now = new Date();
  const stamp = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
  const lines = loadLog();
  lines.push('[' + stamp + '] ' + msg);
  while (lines.length > 400) lines.shift();
  try{ localStorage.setItem(LOG_KEY, JSON.stringify(lines)); }catch(e){ /* 保存できなくても本流は続ける */ }
  renderLog();
}

// ---------- 実行の状態：どのモデルを・どの段階まで試したか ----------
function freshRun(){
  const states = {};
  MODELS.forEach(m => { states[m.id] = { st: 'wait', detail: '' }; });
  return { idx: 0, phase: 'idle', sub: '', dlDeaths: 0, states, done: false, stopped: false };
}
function loadRun(){ try{ return JSON.parse(localStorage.getItem(RUN_KEY) || 'null'); }catch(e){ return null; } }
// 殻への合図：未完の実行がある間は合図を出し続け、殻が落ちた後の自動復帰に使う
const RESUME_KEY = 'llmprobe.resume.v1';
function saveRun(run){
  try{ localStorage.setItem(RUN_KEY, JSON.stringify(run)); }catch(e){ /* 同上 */ }
  try{
    if (run && !run.done && !run.stopped) localStorage.setItem(RESUME_KEY, JSON.stringify({ at: Date.now() }));
    else localStorage.removeItem(RESUME_KEY);
  }catch(e){ /* 同上 */ }
}

// ---------- 盤面（モデル一覧）：道具の読み込みなしで即時に出す ----------
const rowRefs = {};
function renderBoard(run){
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (const m of MODELS){
    const row = document.createElement('div');
    row.className = 'modelrow';
    const strong = document.createElement('strong'); strong.textContent = m.label;
    const small = document.createElement('small');
    small.textContent = m.note + '／キャッシュ：' + (m._cached === true ? 'あり（ダウンロード不要）' : m._cached === false ? 'なし' : '確認中…');
    const st = document.createElement('div'); st.className = 'st';
    row.append(strong, small, st);
    board.appendChild(row);
    rowRefs[m.id] = { row, small, st };
    updateRow(m, run);
  }
}
const ST_LABEL = { wait: 'まだ', active: '試しています…', passed: '動きました', failed: '失敗', crashed: '落ちました' };
function updateRow(m, run){
  const ref = rowRefs[m.id]; if (!ref) return;
  const s = run && run.states[m.id] ? run.states[m.id] : { st: 'wait', detail: '' };
  ref.row.classList.toggle('active', s.st === 'active');
  ref.st.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = '状態：' + (ST_LABEL[s.st] || s.st) + (s.detail ? '（' + s.detail + '）' : '');
  if (s.st === 'passed') span.className = 'ok';
  else if (s.st === 'failed' || s.st === 'crashed') span.className = 'ng';
  else if (s.st === 'active') span.className = 'warn';
  ref.st.appendChild(span);
  ref.small.textContent = m.note + '／キャッシュ：' + (m._cached === true ? 'あり（ダウンロード不要）' : m._cached === false ? 'なし' : '確認中…');
}

// ---------- 結果テキスト（コピー用：まとめ＋ログ全文） ----------
function summaryText(run){
  const lines = ['端末内LLM 検証結果', '日時：' + new Date().toLocaleString('ja-JP'),
    '端末：' + navigator.userAgent, 'WebGPU・環境：' + envText, ''];
  for (const m of MODELS){
    const s = run && run.states[m.id] ? run.states[m.id] : { st: 'wait', detail: '' };
    lines.push(m.label + '：' + (ST_LABEL[s.st] || s.st) + (s.detail ? '（' + s.detail + '）' : ''));
  }
  lines.push('', '--- 記録（ログ） ---');
  return lines.concat(loadLog()).join('\n');
}
async function copyTextRobust(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e2){ /* 予備も失敗 */ }
    ta.remove();
    return ok;
  }
}
document.getElementById('copyBtn').addEventListener('click', async () => {
  const msg = document.getElementById('copyMsg');
  const text = summaryText(loadRun());
  if (await copyTextRobust(text)) msg.textContent = 'コピーしました。そのままチャットに貼れます。';
  else { msg.textContent = 'コピーできませんでした。結果欄に全文を出します。'; document.getElementById('out').textContent = text; }
  setTimeout(() => { msg.textContent = ''; }, 4000);
});
document.getElementById('logCopyBtn').addEventListener('click', async () => {
  const msg = document.getElementById('copyMsg');
  const lines = loadLog();
  if (!lines.length){ msg.textContent = '記録はまだありません。'; setTimeout(() => { msg.textContent = ''; }, 3000); return; }
  if (await copyTextRobust(lines.join('\n'))) msg.textContent = '記録（ログ）をコピーしました。';
  else msg.textContent = 'コピーできませんでした。';
  setTimeout(() => { msg.textContent = ''; }, 4000);
});

// ---------- 環境確認 ----------
async function checkEnv(){
  const gpuEl = document.getElementById('envGpu');
  const adEl = document.getElementById('envAdapter');
  if (!('gpu' in navigator)){
    gpuEl.innerHTML = 'WebGPU: <span class="ng">使えない（navigator.gpu がない）</span>';
    envText = 'WebGPU なし';
    return false;
  }
  try{
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter){
      gpuEl.innerHTML = 'WebGPU: <span class="ng">アダプタが取れない</span>';
      envText = 'WebGPU アダプタなし';
      return false;
    }
    gpuEl.innerHTML = 'WebGPU: <span class="ok">使える</span>';
    let info = '';
    try{
      const i = adapter.info || (adapter.requestAdapterInfo ? await adapter.requestAdapterInfo() : null);
      if (i) info = [i.vendor, i.architecture, i.description].filter(Boolean).join(' / ');
    }catch(e){ /* 情報が取れなくても可否には影響しない */ }
    adEl.textContent = 'アダプタ: ' + (info || '（詳細は取れず）');
    envText = 'WebGPU 可。' + info;
    return true;
  }catch(e){
    gpuEl.innerHTML = 'WebGPU: <span class="ng">確認で失敗</span>';
    envText = 'WebGPU 確認失敗：' + (e && e.message || e);
    return false;
  }
}

// ---------- 道具の読み込み（初回だけ。時間がかかるので記録に残す） ----------
async function ensureWebllm(){
  if (webllm) return webllm;
  const t0 = performance.now();
  log('LLMの道具（WebLLM）を読み込む…');
  webllm = await import('https://esm.run/@mlc-ai/web-llm@0.2.87');
  log('道具の読み込み完了（' + Math.round(performance.now() - t0) + 'ms）');
  return webllm;
}
async function checkCaches(run){
  try{
    await ensureWebllm();
    await Promise.all(MODELS.map(async m => {
      try{ m._cached = await webllm.hasModelInCache(m.id); }catch(e){ m._cached = null; }
      updateRow(m, run);
    }));
  }catch(e){ /* キャッシュ表示は補助。失敗しても本流は続ける */ }
}

// 文脈（覚えていられる長さ）を短くして読み込む。抽出や要約の仕事には 2048 で十分で、
// 覚える場所の分だけメモリが大きく減る。作れなければ通常の作り方に倒す
async function createEngine(modelId, onProgress){
  let appConfig = null;
  try{
    const pre = webllm.prebuiltAppConfig;
    if (pre && Array.isArray(pre.model_list)){
      const list = pre.model_list.map(r => {
        if (r.model_id === modelId){
          return Object.assign({}, r, { overrides: Object.assign({}, r.overrides || {}, { context_window_size: 2048 }) });
        }
        return r;
      });
      appConfig = Object.assign({}, pre, { model_list: list });
    }
  }catch(e){ appConfig = null; }
  const opts = { initProgressCallback: onProgress };
  if (appConfig) opts.appConfig = appConfig;
  return await webllm.CreateMLCEngine(modelId, opts);
}

const BENCH_PROMPT = '次の文から、日付・場所・金額を取り出して、項目ごとに1行で答えてください。\n文：来週の火曜日、つまり11月17日に、板橋区の高島平で開催される説明会に参加する。参加費は3,500円で、当日現金で払う。帰りに駅前の店で2,980円の本を買う予定。\n/no_think';

// ---------- 1つのモデルを試す。戻り値: 'passed' | 'failed' ----------
async function attempt(run, m){
  const prog = document.getElementById('progress');
  const fill = document.getElementById('barFill');
  const out = document.getElementById('out');
  run.states[m.id] = { st: 'active', detail: '' };
  run.phase = 'creating';
  run.sub = m._cached === true ? 'loading' : 'downloading';
  saveRun(run); updateRow(m, run);
  log(m.label + ' を試す（キャッシュ：' + (m._cached === true ? 'あり' : m._cached === false ? 'なし' : '不明') + '）');
  const t0 = performance.now();
  let engine;
  let milestones = {};
  try{
    await ensureWebllm();
    engine = await createEngine(m.id, (r) => {
      const pct = Math.round((r.progress || 0) * 100);
      fill.style.width = pct + '%';
      prog.textContent = '進み具合: ' + pct + '% ' + (r.text || '');
      const txt = (r.text || '').toLowerCase();
      const sub = /fetch|download/.test(txt) ? 'downloading' : (/load|compil|initializ|finish/.test(txt) ? 'loading' : run.sub);
      if (sub !== run.sub){ run.sub = sub; saveRun(run); log(m.label + '：' + (sub === 'downloading' ? 'ダウンロード中' : '読み込み中')); }
      for (const ms of [25, 50, 75, 100]){
        if (pct >= ms && !milestones[ms]){ milestones[ms] = true; log(m.label + '：進み具合 ' + ms + '%'); }
      }
    });
  }catch(e){
    const detail = String(e && e.message || e).slice(0, 120);
    run.states[m.id] = { st: 'failed', detail };
    run.phase = 'idle'; saveRun(run); updateRow(m, run);
    log(m.label + '：読み込みで失敗（' + detail + '）。次のモデルへ進む');
    return 'failed';
  }
  const loadSec = ((performance.now() - t0) / 1000).toFixed(1);
  log(m.label + '：読み込み成功（' + loadSec + '秒）。測定する');
  run.phase = 'generating'; saveRun(run);
  try{
    const stream = await engine.chat.completions.create({
      messages: [{ role: 'user', content: BENCH_PROMPT }],
      stream: true, temperature: 0.2, max_tokens: 160,
      stream_options: { include_usage: true }
    });
    const g0 = performance.now();
    let text = '', tokens = 0, ttft = 0;
    for await (const chunk of stream){
      const d = chunk.choices && chunk.choices[0] && chunk.choices[0].delta;
      if (d && d.content){
        if (!ttft) ttft = Math.round(performance.now() - g0);
        text += d.content;
      }
      if (chunk.usage && chunk.usage.completion_tokens) tokens = chunk.usage.completion_tokens;
    }
    const secs = (performance.now() - g0) / 1000;
    let tps = tokens ? tokens / secs : 0;
    try{
      const s = await engine.runtimeStatsText();
      const mm = /([0-9]+(?:\.[0-9]+)?)\s*tok\/s/i.exec(s || '');
      if (mm) tps = parseFloat(mm[1]);
    }catch(e){ /* 速度は自前計算で代替済み */ }
    const detail = '速度 ' + tps.toFixed(1) + ' tok/s、最初の文字まで ' + ttft + 'ms、読み込み ' + loadSec + '秒';
    run.states[m.id] = { st: 'passed', detail };
    run.phase = 'idle'; saveRun(run); updateRow(m, run);
    log(m.label + '：測定できた。' + detail);
    out.textContent = summaryText(run) + '\n\n--- モデルの答え ---\n' + text.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
  }catch(e){
    const detail = String(e && e.message || e).slice(0, 120);
    run.states[m.id] = { st: 'failed', detail: '生成で失敗：' + detail };
    run.phase = 'idle'; saveRun(run); updateRow(m, run);
    log(m.label + '：生成で失敗（' + detail + '）。次のモデルへ進む');
    try{ await engine.unload(); }catch(e2){ /* 後片付けは任意 */ }
    return 'failed';
  }
  try{ await engine.unload(); }catch(e){ /* 後片付けは任意 */ }
  return 'passed';
}

// ---------- 大きい順に繰り返す ----------
async function runChain(){
  if (chainRunning) return;
  chainRunning = true;
  stopRequested = false;
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  startBtn.disabled = true; stopBtn.style.display = 'block';
  // 長い読み込みの間も殻への合図を出し続ける（落ちた後の自動復帰のため）
  const beatIv = setInterval(() => { const r = loadRun(); if (r) saveRun(r); }, 20000);
  let run = loadRun() || freshRun();
  while (run.idx < MODELS.length){
    if (stopRequested){ run.stopped = true; saveRun(run); log('止めるが押されたので、ここで止める'); break; }
    const m = MODELS[run.idx];
    const r = await attempt(run, m);
    run = loadRun() || run;
    if (r === 'passed'){ run.done = true; saveRun(run); log('結論：' + m.label + ' がこの端末で動く'); break; }
    run.idx += 1; run.dlDeaths = 0; saveRun(run);
  }
  run = loadRun() || run;
  if (!run.done && !run.stopped && run.idx >= MODELS.length){
    run.done = true; saveRun(run);
    log('結論：全部のモデルで動かなかった');
    document.getElementById('out').textContent = summaryText(run);
  }
  clearInterval(beatIv);
  startBtn.disabled = false; stopBtn.style.display = 'none';
  chainRunning = false;
}

document.getElementById('startBtn').addEventListener('click', () => {
  const run = freshRun();
  saveRun(run);
  MODELS.forEach(m => updateRow(m, run));
  log('=== 測定をはじめる（大きい順に自動） ===');
  runChain();
});
document.getElementById('stopBtn').addEventListener('click', () => {
  stopRequested = true;
  const run = loadRun();
  if (run){ run.stopped = true; saveRun(run); }
  log('止めるが押された');
});

// ---------- 開いた時の処理：前回落ちていたら、続きから自動で ----------
(async () => {
  renderLog();
  let run = loadRun();
  renderBoard(run);
  const ok = await checkEnv();
  if (!ok){ document.getElementById('out').textContent = 'WebGPU が使えないため、測定はできません。'; return; }
  // 旧い印（v1）が残っていたら記録に移して消す
  try{
    const old = JSON.parse(localStorage.getItem('llmprobe.attempt.v1') || 'null');
    if (old){ log('前の版の印：' + old.model + ' の ' + old.stage + ' で止まっていた'); localStorage.removeItem('llmprobe.attempt.v1'); }
  }catch(e){ /* 任意 */ }
  let resume = false;
  if (run && !run.done && !run.stopped && run.idx < MODELS.length){
    const active = MODELS[run.idx];
    if (run.phase === 'creating' || run.phase === 'generating'){
      if (run.sub === 'downloading' && run.dlDeaths < 1){
        run.dlDeaths += 1; run.phase = 'idle'; saveRun(run);
        log(active.label + '：ダウンロードの途中で落ちた形跡。同じモデルでもう一度試す');
      }else{
        run.states[active.id] = { st: 'crashed', detail: run.phase === 'generating' ? '測定中に落ちた' : '読み込み中に落ちた' };
        log(active.label + '：' + (run.phase === 'generating' ? '測定中' : '読み込み中') + 'に落ちた形跡。次のモデルへ進む');
        run.idx += 1; run.dlDeaths = 0; run.phase = 'idle'; saveRun(run);
      }
      renderBoard(run);
    }
    if (run.idx < MODELS.length){
      resume = true;
      log('前回の続きから自動ではじめる（次は ' + MODELS[run.idx].label + '）');
      document.getElementById('out').textContent = '前回は途中で落ちていました。続きを自動ではじめます。止めたい時は「止める」を押してください。';
    }else{
      run.done = true; saveRun(run);
      log('結論：全部のモデルで動かなかった');
    }
  }
  checkCaches(run);
  if (resume) setTimeout(() => { runChain(); }, 1500);
})();
</script>
</body>
</html>
