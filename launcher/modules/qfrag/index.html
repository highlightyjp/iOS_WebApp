<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>断片 d12</title>
<style>
:root{ --label:#f2f2f7; --label2:rgba(235,235,245,.6); --accent:#0a84ff; --warn:#ffd60a; --bad:#ff453a;
  --fill:rgba(120,120,128,.18); --card:rgba(28,28,30,.92); --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark; }
*{ box-sizing:border-box; }
html,body{ height:100%; }
body{ margin:0; font-family:-apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; color:var(--label);
  background:linear-gradient(180deg,#0b1526,#071018); overflow:hidden; }
#scene{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:manipulation; }
.hud{ position:fixed; top:calc(10px + env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
.hud .ttl{ font-size:13px; color:var(--label2); text-shadow:0 1px 6px rgba(0,0,0,.6); }
.hud button{ pointer-events:auto; }
button{ border:none; cursor:pointer; border-radius:999px; padding:8px 14px; background:var(--fill); color:var(--label);
  font-size:13.5px; font-weight:600; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
button.on{ background:var(--accent); color:#fff; }
.panel{ position:fixed; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); background:var(--card);
  border-radius:18px; box-shadow:var(--shadow); padding:14px; max-height:62vh; overflow-y:auto; display:none; }
.panel.open{ display:block; }
.panel h2{ font-size:14px; margin:2px 0 8px; }
.knob{ display:flex; align-items:center; gap:10px; margin:8px 0; font-size:13px; }
.knob label{ flex:0 0 108px; color:var(--label2); }
.knob input[type=range]{ flex:1; }
.knob .val{ flex:0 0 44px; text-align:right; font-variant-numeric:tabular-nums; }
.row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.mono{ font-family:ui-monospace, Menlo, monospace; font-size:11.5px; white-space:pre-wrap; word-break:break-all; }
.small{ font-size:12px; color:var(--label2); }
#dbg{ position:fixed; top:calc(52px + env(safe-area-inset-top)); right:10px; width:min(320px, 86vw); background:var(--card);
  border-radius:14px; box-shadow:var(--shadow); padding:10px 12px; display:none; z-index:30; }
#dbg.open{ display:block; }
#dbg .log{ max-height:150px; overflow-y:auto; }
textarea{ width:100%; border-radius:10px; border:none; background:var(--fill); color:var(--label); padding:8px; font-size:13px; }
#exportSheet{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:40; }
#exportSheet.open{ display:flex; }
#exportSheet .sheet{ background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:16px; max-height:88vh; overflow-y:auto; }
#exportSheet img{ width:100%; border-radius:12px; }
#logBtn{ position:fixed; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); z-index:30; background:rgba(20,28,40,.85); color:#d7e6f5; border:1px solid rgba(160,190,220,.35); border-radius:999px; padding:8px 14px; font-size:13px; display:none; }
#logBtn.open{ display:block; }
#logSheet{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-end; z-index:45; }
#logSheet.open{ display:flex; }
#logSheet .box{ background:#101623; width:100%; max-height:82%; overflow:auto; border-radius:16px 16px 0 0; padding:16px; }
#logSheet pre{ white-space:pre-wrap; word-break:break-all; font-size:12px; line-height:1.6; color:#d7e6f5; background:#0a0f18; border-radius:10px; padding:10px; max-height:46vh; overflow:auto; }
#logSheet .row{ display:flex; gap:8px; margin-top:10px; }
#logSheet a.dl, #logSheet button{ flex:1; text-align:center; background:#1d2a3d; color:#eaf2fb; border:1px solid rgba(160,190,220,.35); border-radius:10px; padding:10px; font-size:14px; text-decoration:none; }
#evStrip{ position:fixed; left:0; right:0; bottom:0; display:none; gap:6px; padding:8px; background:rgba(10,14,20,.88); z-index:35; }
#evStrip.open{ display:flex; }
#evStrip figure{ margin:0; flex:1; }
#evStrip img{ width:100%; display:block; border-radius:8px; }
#evStrip figcaption{ color:#d7e6f5; font-size:11px; text-align:center; margin-top:4px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <div class="ttl"></div>
  <div style="display:flex;gap:8px">
    <button id="knobBtn">つまみ</button>
    <button id="dbgBtn">デバッグ</button>
  </div>
</div>

<div id="dbg">
  <div class="mono" id="dbgState"></div>
  <div class="small" style="margin-top:6px">開幕検出（無操作の画素差分）</div>
  <div class="mono" id="dbgCaps"></div>
  <div class="small" style="margin-top:6px">出来事</div>
  <div class="mono log" id="dbgLog"></div>
</div>

<div class="panel" id="knobPanel">
  <h2>つまみ（数値は外に出して、実行中に即時反映）</h2>
  <div id="knobs"></div>
  <div class="row">
    <button id="copyParams">値をコピー</button>
    <button id="resetParams">初期値に戻す</button>
  </div>
  <div class="small" style="margin-top:8px">良い値は録画と組で保存する。ここではコピーした JSON がその記録になる。</div>
  <h2 style="margin-top:16px">今日の1枚</h2>
  <textarea id="bodyNote" rows="2" placeholder="体の一文（作り手が遊んで、体に起きたこと）"></textarea>
  <div class="row">
    <button id="exportBtn">今日の1枚を出す</button>
  </div>
</div>

<div id="evStrip"></div>
<div id="exportSheet">
  <div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>今日の1枚</strong>
      <button id="exportClose">閉じる</button>
    </div>
    <img id="exportImg" alt="開幕10秒の撮影">
    <div class="small" style="margin:8px 0 4px">長押しで保存できます。</div>
    <textarea id="exportJson" rows="7" readonly></textarea>
    <div class="row"><button id="exportCopy">記録 JSON をコピー</button></div>
  </div>
</div>

<script type="application/json" id="fragParams">
{ "wanderSpeed": 26, "hopPower": 1, "blinkSec": 3.4, "size": 30, "drift": 14, "waitSec": 4.5, "waitHop": 9, "selfSec": 11 }
</script>
<script>
'use strict';
/* ===== 断片キット：断片期の道具立て（第0段-2）
   1) 数値はプログラムの外（JSON＋つまみ）に出し、実行中へ即時反映する
   2) デバッグ表示は切替式。初見の画面ではオフ
   3) 開幕の自動撮影：0秒・3秒・10秒を撮り、無操作の画素差分を出す ===== */
/* 観察用ビルド：?obs=1 で作り手の道具（つまみ／デバッグ／今日の1枚）を画面から隠す。
   断片の中身は不変。作り手は通常URLで開く */
var OBS = /[?&]obs=1/.test(location.search);
if(OBS){
  document.getElementById('knobBtn').style.display = 'none';
  document.getElementById('dbgBtn').style.display = 'none';

  /* 観察用：セッションログの書き出し（観察の後で、自分の操作記録と突き合わせるための道具） */
  var logBtn = document.createElement('button');
  logBtn.id = 'logBtn'; logBtn.textContent = 'ログ書き出し'; logBtn.classList.add('open');
  document.body.appendChild(logBtn);
  var logSheet = document.createElement('div');
  logSheet.id = 'logSheet';
  var logBox = document.createElement('div'); logBox.className = 'box';
  var logTitle = document.createElement('div');
  logTitle.textContent = 'セッションログ（タップ・返し・状態変化）';
  logTitle.style.cssText = 'color:#eaf2fb;font-size:15px;margin-bottom:8px;';
  var logPre = document.createElement('pre');
  var logRow = document.createElement('div'); logRow.className = 'row';
  var logDl = document.createElement('a'); logDl.className = 'dl'; logDl.textContent = 'ダウンロード';
  var logClose = document.createElement('button'); logClose.textContent = '閉じる';
  logRow.appendChild(logDl); logRow.appendChild(logClose);
  logBox.appendChild(logTitle); logBox.appendChild(logPre); logBox.appendChild(logRow);
  logSheet.appendChild(logBox);
  document.body.appendChild(logSheet);
  logBtn.addEventListener('click', function(){
    var taps = evLog.filter(function(e){ return e.kind === 'タップ'; });
    var nGround = taps.filter(function(e){ return e.detail.indexOf('（地面）') === 0; }).length;
    var nSelf = taps.filter(function(e){ return e.detail.indexOf('（本人）') === 0; }).length;
    var nStar = taps.filter(function(e){ return e.detail.indexOf('（粒）') === 0; }).length;
    var nSelfMove = evLog.filter(function(e){ return e.detail.indexOf('自律移動') === 0; }).length;
    var head = '断片セッションログ（' + (window.__build || 'build 不明') + '）\n'
      + '開始：' + new Date(T0 + performance.timeOrigin).toLocaleString('ja-JP') + '\n'
      + '時刻は、ページを開いてからの秒数です。\n\n';
    var foot = '\n\n集計：タップ ' + taps.length + '件（地面 ' + nGround + '／本人 ' + nSelf + '／粒 ' + nStar + '）、自律移動 ' + nSelfMove + '件';
    var text = head + evLog.map(elogLine).join('\n') + foot;
    logPre.textContent = text;
    var blob = new Blob([text], { type:'text/plain' });
    logDl.href = URL.createObjectURL(blob);
    logDl.download = 'qfrag-session-log.txt';
    logSheet.classList.add('open');
  });
  logClose.addEventListener('click', function(){ logSheet.classList.remove('open'); });
}
var PARAM_DEFS = [
  { key:'wanderSpeed', label:'さまよう速さ', min:0, max:70, step:1 },
  { key:'hopPower', label:'跳ねの強さ', min:0.3, max:2.2, step:0.1 },
  { key:'blinkSec', label:'まばたき間隔(秒)', min:1.2, max:8, step:0.2 },
  { key:'waitSec', label:'待つ長さ(秒)', min:1.5, max:9, step:0.5 },
  { key:'waitHop', label:'待ち跳ねの高さ', min:0, max:22, step:1 },
  { key:'selfSec', label:'自分から動く間隔(秒)', min:4, max:30, step:1 },
  { key:'drift', label:'漂う粒の数', min:0, max:40, step:1 }
];
var DEFAULTS = JSON.parse(document.getElementById('fragParams').textContent);
var params = Object.assign({}, DEFAULTS);
try {
  var saved = JSON.parse(localStorage.getItem('qfrag.params') || 'null');
  if(saved) params = Object.assign({}, DEFAULTS, saved);
} catch(e) {}
function saveParams(){ try { localStorage.setItem('qfrag.params', JSON.stringify(params)); } catch(e) {} }

/* ===== 断片 d1（第2段・1日目）
   灯台：「開いた瞬間、もう世界が動いていて、誰かがいて、触れば返ってくる」
   画面には説明を出さない。入力はタップ1つ、返しは跳ねて寄る1つ。 ===== */
var cv = document.getElementById('scene');
var ctx = cv.getContext('2d');
var W = 0, H = 0, dpr = 1;
var R = 30, S = 1;
function computeScale(){ R = Math.max(30, Math.min(160, Math.round(W / 10))); S = R / 30; }
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  computeScale();
}
window.addEventListener('resize', resize);
resize();

var state = { taps:0, hops:0, startedAt:performance.now(), frames:0, fps:0 };

/* ==== セッション出来事ログ（観察の道具） ====
   タップ・返し・状態変化を時刻つきで残す。観察後に書き出して、観察者の操作記録と突き合わせる。 */
var T0 = performance.now();
var evLog = [];
function elog(kind, detail){
  if(evLog.length > 800) evLog.shift();
  evLog.push({ s:(performance.now() - T0) / 1000, kind:kind, detail:detail });
}
function elogLine(e){
  var ss = e.s.toFixed(1);
  return '[' + ('     ' + ss).slice(-6) + 's] ' + e.kind + ' ' + e.detail;
}
var logs = [];
function log(s){
  logs.unshift(new Date().toLocaleTimeString('ja-JP') + ' ' + s);
  logs = logs.slice(0, 8);
  var el = document.getElementById('dbgLog');
  if(el) el.textContent = logs.join('\n');
}
/* 誰か：丸い体。無操作でもさまよい、まばたきする。タップへの返しは「跳ねて寄る」1つ */
var crea = { x:0, y:0, vx:0, vy:0, dir:1, blinkUntil:0, nextBlink:2000, hop:null, squash:0, look:0, waitFrom:0, waitUntil:0, lookC:1, nextSelf:0, absorbAt:0, startleAt:0, attendUntil:0, pendingStar:false, noticePending:false, noticeUntil:0, noticeDir:1 };
var ripples = [];
var star = null;      /* 目立つ粒：1つだけ。そいつが取りに行く相手 */
var starAt = 0;       /* 次に目立つ粒が出る時刻 */
var motes = [];
function seedCre(){
  crea.x = W * 0.5; crea.y = H * 0.55;
  crea.dir = Math.random() < 0.5 ? -1 : 1;
  crea.nextSelf = performance.now() + 6000;
  star = { x:0.22 + Math.random() * 0.56, y:0.3 + Math.random() * 0.4, s:1.6, p:Math.random() * 6.28, pointedUntil:0 }; elog('状態', '粒が出た');
  starAt = 0;
  motes = [];
  for(var i = 0; i < 40; i++) motes.push({ x:Math.random(), y:Math.random(), s:Math.random() * 2 + 0.6, p:Math.random() * 6.28 });
}
seedCre();
var lastNow = 0;
function starPos(t){
  if(!star) return null;
  return { x: ((star.x + t * 0.008 * (1 + star.s * 0.3)) % 1) * W,
           y: (star.y + Math.sin(t * 0.5 + star.p) * 0.01) * H };
}
function draw(now){
  state.frames++;
  var dt = Math.min(0.05, lastNow ? (now - lastNow) / 1000 : 0.016);
  lastNow = now;
  var t = now / 1000;
  /* 場所：淡い場と、漂う粒（無操作でも動く） */
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#101c30'); g.addColorStop(1, '#081420');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(180,220,255,.35)';
  var nd = Math.round(params.drift);
  for(var i = 0; i < nd; i++){
    var m = motes[i % motes.length];
    var mx = ((m.x + t * 0.008 * (1 + m.s * 0.3)) % 1) * W;
    var my = (m.y + Math.sin(t * 0.5 + m.p) * 0.01) * H;
    ctx.beginPath(); ctx.arc(mx, my, m.s, 0, Math.PI * 2); ctx.fill();
  }
  /* 目立つ粒（1つだけ） */
  var sp2 = starPos(t);
  if(sp2){
    var pointed = now < (star.pointedUntil || 0);
    var pulse = (pointed ? (7.2 + Math.sin(t * 7) * 2.2) : (4.6 + Math.sin(t * 2.2) * 1.1)) * S;
    ctx.fillStyle = pointed ? 'rgba(255,214,120,.40)' : 'rgba(255,214,120,.22)';
    ctx.beginPath(); ctx.arc(sp2.x, sp2.y, pulse * 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd678';
    ctx.beginPath(); ctx.arc(sp2.x, sp2.y, pulse, 0, Math.PI * 2); ctx.fill();
  }
  /* 波紋（返しの痕） */
  ripples = ripples.filter(function(r){ return now - r.at < 700; });
  ripples.forEach(function(r){
    var k = (now - r.at) / 700;
    ctx.strokeStyle = 'rgba(125,249,255,' + (0.55 * (1 - k)).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, (6 + k * 46) * S, 0, Math.PI * 2); ctx.stroke();
  });
/* 誰かの移動：跳ねていない時は、ゆっくりさまよう */
  var r = R;
  if(crea.hop){
    var hp = crea.hop;
    var k2 = (now - hp.at) / hp.dur;
    if(k2 >= 1){ crea.x = hp.tx; crea.y = hp.ty; crea.hop = null; crea.squash = 1; crea.waitFrom = now; crea.waitUntil = now + params.waitSec * 1000; log('着地 → こちらを向いて待つ'); elog('状態', '着地 → 待つ');
      if(hp.toStar && star){ var sp4 = starPos(t); if(sp4 && Math.hypot(sp4.x - crea.x, sp4.y - crea.y) < r + 26 * S){ star = null; starAt = now + 7000 + Math.random() * 4000; crea.absorbAt = now; log('粒を取り込んだ'); elog('状態', '粒を取り込んだ'); } } }
      if(crea.pendingStar && star){ crea.pendingStar = false; var sp5 = starPos(t); if(sp5){ crea.noticePending = true; crea.noticeUntil = now + 650; crea.noticeDir = sp5.x >= crea.x ? 1 : -1; crea.waitUntil = 0; log('着地 → 指さされた粒に気づく'); elog('状態', '気づく一拍の開始（着地後・指さされた粒）'); } }
    else {
      crea.x = hp.fx + (hp.tx - hp.fx) * k2;
      crea.y = hp.fy + (hp.ty - hp.fy) * k2 - Math.sin(k2 * Math.PI) * 54 * S * params.hopPower;
    }
  }
  else if(now < crea.waitUntil){
    /* 待つ：その場で小さく跳ねて、次を誘う（予備動作）。さまよいは止める */
    crea.vx = 0; crea.vy = 0;
  } else {
    crea.vx += (Math.random() - 0.5) * 14 * dt;
    crea.vy += (Math.random() - 0.5) * 10 * dt;
    var sp = Math.hypot(crea.vx, crea.vy), max = params.wanderSpeed;
    if(sp > max){ crea.vx = crea.vx / sp * max; crea.vy = crea.vy / sp * max; }
    crea.x += crea.vx * dt; crea.y += crea.vy * dt;
    if(crea.x < r + 8){ crea.x = r + 8; crea.vx = Math.abs(crea.vx); }
    if(crea.x > W - r - 8){ crea.x = W - r - 8; crea.vx = -Math.abs(crea.vx); }
    if(crea.y < r + 70){ crea.y = r + 70; crea.vy = Math.abs(crea.vy); }
    if(crea.y > H - r - 30){ crea.y = H - r - 30; crea.vy = -Math.abs(crea.vy); }
    if(Math.abs(crea.vx) > 2) crea.dir = crea.vx > 0 ? 1 : -1;
  }
  if(!star && starAt && now > starAt){ star = { x:0.15 + Math.random() * 0.7, y:0.28 + Math.random() * 0.44, s:1.6, p:Math.random() * 6.28, pointedUntil:0 }; starAt = 0; elog('状態', '粒が出た'); }
  if(crea.noticePending && !crea.hop && now >= crea.noticeUntil){
    /* 気づく一拍が明けた：粒を見た後で、取りに行く */
    crea.noticePending = false;
    if(star){
      var spN = starPos(t);
      if(spN){
        var txN = Math.max(r + 8, Math.min(W - r - 8, spN.x));
        var tyN = Math.max(r + 70, Math.min(H - r - 30, spN.y));
        var distN = Math.hypot(txN - crea.x, tyN - crea.y);
        crea.hop = { fx:crea.x, fy:crea.y, tx:txN, ty:tyN, at:now, dur:Math.max(320, Math.min(780, distN * 1.25)), toStar:true };
        log('気づいた → 取りに行く'); elog('返し', '指さしへの返し（気づいてから取りに行く跳躍）');
      }
    }
  }
  if(!crea.hop && !crea.noticePending && now >= crea.waitUntil && crea.nextSelf && now > crea.nextSelf){
    /* 世界の側から動く：目立つ粒を取りに行く時だけ。行き先＝粒の今の場所 */
    var sp3 = starPos(t);
    if(sp3){
      var tx0 = Math.max(r + 8, Math.min(W - r - 8, sp3.x));
      var ty0 = Math.max(r + 70, Math.min(H - r - 30, sp3.y));
      var dist0 = Math.hypot(tx0 - crea.x, ty0 - crea.y);
      crea.hop = { fx:crea.x, fy:crea.y, tx:tx0, ty:ty0, at:now, dur:Math.max(320, Math.min(780, dist0 * 1.25)), toStar:true };
      log('世界から動いた（粒を取りに行く）'); elog('返し', '自律移動の開始（粒を取りに行く）');
    }
    crea.nextSelf = now + params.selfSec * 1000 * (0.7 + Math.random() * 0.7);
  }
  if(crea.squash > 0) crea.squash = Math.max(0, crea.squash - dt * 5);
  /* 待つ間の予備動作：沈んで（予備）→小さく跳ねる。目は徐々にこちらを向く */
  var waiting = !crea.hop && now < crea.waitUntil;
  var lift = 0, crouch = 0;
  if(waiting){
    var ph = ((now - crea.waitFrom) % 950) / 950;
    var sn = Math.sin(ph * Math.PI * 2);
    lift = Math.pow(Math.max(0, sn), 1.4) * params.waitHop * S;
    crouch = Math.max(0, -sn) * 0.09;
  }
  crea.lookC += (((now < crea.noticeUntil) ? crea.noticeDir : ((waiting || now < crea.attendUntil) ? 0 : crea.dir)) - crea.lookC) * Math.min(1, dt * 7);
  var startled = crea.startleAt && (now - crea.startleAt) < 460;
  var sLift = 0;
  if(startled){
    var sk = (now - crea.startleAt) / 460;
    var sCurve = sk < 0.26 ? (sk / 0.26) : (sk > 0.65 ? Math.max(0, (1 - sk) / 0.35) : 1);
    sLift = sCurve * 34 * S;
  }
  /* 満ちた様子：取り込んでから次の粒が出るまでの間だけ続く状態 */
  var contented = !star && crea.absorbAt > 0;
  /* まばたき */
  if(now > crea.nextBlink){ crea.blinkUntil = now + (contented ? 260 : 130); crea.nextBlink = now + params.blinkSec * 1000 * (0.7 + Math.random() * 0.6) * (contented ? 1.9 : 1); }
  var blinking = now < crea.blinkUntil;
  var hopping = !!crea.hop;
  /* 取り込む瞬間の1拍（300ms）：光の返し。出すのはこの瞬間だけ */
  var abK = crea.absorbAt ? (now - crea.absorbAt) / 300 : 9;
  if(abK >= 0 && abK < 1){
    var abGlow = Math.sin(abK * Math.PI);
    var gg = ctx.createRadialGradient(crea.x, crea.y - lift, 2, crea.x, crea.y - lift, r * (1.6 + abK * 1.6));
    gg.addColorStop(0, 'rgba(255,230,150,' + (0.5 * abGlow).toFixed(3) + ')');
    gg.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(crea.x, crea.y - lift, r * (1.6 + abK * 1.6), 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,230,150,' + (0.65 * (1 - abK)).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(crea.x, crea.y - lift, r * (1.05 + abK * 0.9), 0, Math.PI * 2); ctx.stroke();
  }
  /* 体 */
  var sq = crea.squash * 0.18 + crouch;
  ctx.save();
  ctx.translate(crea.x + (contented ? Math.sin(t * 1.15) * 3 * S : 0), crea.y - lift - sLift);
  if(contented) ctx.rotate(Math.sin(t * 1.15) * 0.045);
  ctx.scale(1 + sq, 1 - sq);
  if(abK >= 0 && abK < 1){ var us = 1 + Math.sin(abK * Math.PI) * 0.13; ctx.scale(us, us); }
  var bg = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.2, 0, 0, r * 1.15);
  bg.addColorStop(0, '#ffe9a8'); bg.addColorStop(1, '#f5b942');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  /* 目：進む方を見る。跳ねている間は見開く */
  var lx = crea.lookC * r * 0.16, wide = startled ? 2 : (hopping ? 1.5 : 1);
  ctx.fillStyle = '#22303f';
  if(blinking){
    ctx.fillRect(-r * 0.34 + lx - r * 0.11, -r * 0.08, r * 0.22, 2.4);
    ctx.fillRect(r * 0.12 + lx - r * 0.11, -r * 0.08, r * 0.22, 2.4);
  } else {
    ctx.beginPath(); ctx.arc(-r * 0.23 + lx, -r * 0.08, r * 0.1 * wide, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.23 + lx, -r * 0.08, r * 0.1 * wide, 0, Math.PI * 2); ctx.fill();
  }
  /* 口：通常は小さな弧。驚いている間は開いた口（静止画でも判別できる変化） */
  if(startled){
    ctx.fillStyle = '#22303f';
    ctx.beginPath(); ctx.ellipse(lx * 0.4, r * 0.26, r * 0.13, r * 0.19, 0, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.strokeStyle = '#22303f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(lx * 0.4, r * 0.18, r * 0.16, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
  try { selftestTick(now); } catch(e){}
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

cv.addEventListener('pointerdown', function(ev){
  var now = performance.now();
  state.taps++;
  /* 粒へのタップ：「指さした」ことにする。粒が強く脈打ち、そいつが気づいて取りに行く */
  if(star){
    var spT = starPos(now / 1000);
    if(spT && Math.hypot(ev.clientX - spT.x, ev.clientY - spT.y) < Math.max(48, 40 * S)){
      elog('タップ', '（粒） x=' + Math.round(spT.x) + ' y=' + Math.round(spT.y));
      star.pointedUntil = now + 2600;
      ripples.push({ x:spT.x, y:spT.y, at:now });
      if(!crea.hop){
        crea.noticePending = true;
        crea.noticeUntil = now + 650;
        crea.noticeDir = spT.x >= crea.x ? 1 : -1;
        crea.waitUntil = 0;
        log('粒を指さした → 気づく');
        elog('状態', '気づく一拍の開始（指さされた粒）');
      } else {
        crea.pendingStar = true;
        log('粒を指さした → 着地したら取りに行く');
      }
      return;
    }
  }
  /* 本人へのタップ：距離ゼロの「寄る」は見える返しにならない。驚いてその場で跳ね、こちらを見る */
  if(!crea.hop && Math.hypot(ev.clientX - crea.x, ev.clientY - crea.y) < R + 12 * S){
    crea.noticePending = false; crea.pendingStar = false;
    elog('タップ', '（本人） x=' + Math.round(ev.clientX) + ' y=' + Math.round(ev.clientY));
    crea.startleAt = now;
    elog('返し', '驚き（本人タップへの返し・跳ね ' + Math.round(34 * S) + 'px）');
    crea.attendUntil = now + 1600;
    crea.waitUntil = 0;
    ripples.push({ x:ev.clientX, y:ev.clientY, at:now });
    state.hops++;
    log('本人タップ → 驚いて跳ねる');
    return;
  }
  crea.noticePending = false; crea.pendingStar = false;
  var tx = Math.max(R + 8, Math.min(W - R - 8, ev.clientX));
  var ty = Math.max(R + 70, Math.min(H - R - 30, ev.clientY));
  var dist = Math.hypot(tx - crea.x, ty - crea.y);
  crea.hop = { fx:crea.x, fy:crea.y, tx:tx, ty:ty, at:now, dur:Math.max(240, Math.min(620, dist * 1.1)) };
  crea.waitUntil = 0;
  ripples.push({ x:ev.clientX, y:ev.clientY, at:now });
  state.hops++;
  log('タップ → 跳ねて寄る（距離 ' + Math.round(dist) + '）');
  elog('タップ', '（地面） x=' + Math.round(ev.clientX) + ' y=' + Math.round(ev.clientY));
  elog('返し', '跳んで寄る（距離 ' + Math.round(dist) + '）');
});

/* ===== 証跡モード（?evidence=1・作り手用）：驚き反応のピークを撮る ===== */
var EVIDENCE = /[?&]evidence=1/.test(location.search);
if(EVIDENCE){
  var evStripEl = document.getElementById('evStrip');
  var evCap = function(label){
    var fig = document.createElement('figure');
    var img = document.createElement('img');
    img.src = cv.toDataURL('image/jpeg', 0.85);
    img.alt = label;
    var cap = document.createElement('figcaption');
    cap.textContent = label;
    fig.appendChild(img); fig.appendChild(cap);
    evStripEl.appendChild(fig);
    evStripEl.classList.add('open');
  };
  setTimeout(function(){
    evCap('反応前');
    crea.startleAt = performance.now();
    crea.attendUntil = crea.startleAt + 1600;
    setTimeout(function(){ evCap('ピーク（驚き）'); }, 210);
    setTimeout(function(){ evCap('反応後'); }, 1100);
  }, 1500);
}

/* ===== セルフテスト（作り手用）：?selftest=star で、粒へのタップ分岐の発火を合成イベントで確かめる ===== */
var SELFTEST_STAR = /[?&]selftest=star/.test(location.search);
var selftestDone = false;
function selftestTick(now){
  if(!SELFTEST_STAR || selftestDone || !star || crea.hop) return;
  if(crea.selfAt - now < 2500) return;
  var sp = starPos(now / 1000);
  if(!sp) return;
  selftestDone = true;
  elog('状態', 'セルフテスト：粒の位置へ pointerdown を合成した');
  var ev = null;
  try { ev = new PointerEvent('pointerdown', { clientX: sp.x, clientY: sp.y, bubbles: true }); }
  catch(e){
    ev = document.createEvent('Event');
    ev.initEvent('pointerdown', true, false);
    ev.clientX = sp.x; ev.clientY = sp.y;
  }
  cv.dispatchEvent(ev);
}

/* ===== 開幕の自動撮影（0秒・3秒・10秒、無操作差分） ===== */
var caps = []; /* {at, url, small:ImageData} */
function snapshot(at){
  var url = cv.toDataURL('image/png');
  var off = document.createElement('canvas');
  off.width = 96; off.height = 160;
  var octx = off.getContext('2d');
  var img = new Image();
  img.onload = function(){
    octx.drawImage(img, 0, 0, 96, 160);
    caps.push({ at: at, url: url, data: octx.getImageData(0, 0, 96, 160).data });
    renderCaps();
  };
  img.src = url;
}
function diffRatio(a, b){
  if(!a || !b) return null;
  var diff = 0, n = a.length;
  for(var i = 0; i < n; i += 4){
    if(Math.abs(a[i] - b[i]) + Math.abs(a[i+1] - b[i+1]) + Math.abs(a[i+2] - b[i+2]) > 36) diff++;
  }
  return diff / (n / 4);
}
function renderCaps(){
  var el = document.getElementById('dbgCaps');
  if(!el) return;
  var lines = caps.map(function(c){ return c.at + '秒 撮影済み'; });
  if(caps.length >= 2){
    var d03 = diffRatio(caps[0].data, caps[1].data);
    if(d03 !== null) lines.push('差分 0→3秒: ' + (d03 * 100).toFixed(2) + '%');
  }
  if(caps.length >= 3){
    var d310 = diffRatio(caps[1].data, caps[2].data);
    if(d310 !== null){
      lines.push('差分 3→10秒: ' + (d310 * 100).toFixed(2) + '%');
      lines.push(d310 < 0.001 ? '判定: 赤信号（無操作でほぼ静止）' : '判定: 無操作でも動いている');
    }
  }
  el.textContent = lines.join('\n');
}
setTimeout(function(){ snapshot(0); }, 60);
setTimeout(function(){ snapshot(3); }, 3000);
setTimeout(function(){ snapshot(10); }, 10000);

/* ===== デバッグ表示（既定オフ） ===== */
var dbgOn = false;
setInterval(function(){
  state.fps = state.frames; state.frames = 0;
  if(!dbgOn) return;
  var up = ((performance.now() - state.startedAt) / 1000).toFixed(0);
  document.getElementById('dbgState').textContent =
    (window.__build ? window.__build + '\n' : '') + 'fps ' + state.fps + ' / 稼働 ' + up + '秒\nタップ ' + state.taps + ' / 返し ' + state.hops +
    '\nparams ' + JSON.stringify(params);
}, 1000);
document.getElementById('dbgBtn').addEventListener('click', function(){
  dbgOn = !dbgOn;
  document.getElementById('dbg').classList.toggle('open', dbgOn);
  this.classList.toggle('on', dbgOn);
  if(dbgOn) renderCaps();
});

/* ===== つまみ（即時反映） ===== */
var knobPanel = document.getElementById('knobPanel');
document.getElementById('knobBtn').addEventListener('click', function(){
  knobPanel.classList.toggle('open');
  this.classList.toggle('on', knobPanel.classList.contains('open'));
});
function buildKnobs(){
  var host = document.getElementById('knobs');
  host.innerHTML = '';
  PARAM_DEFS.forEach(function(d){
    var row = document.createElement('div');
    row.className = 'knob';
    row.innerHTML = '<label>' + d.label + '</label>';
    var input = document.createElement('input');
    input.type = 'range'; input.min = d.min; input.max = d.max; input.step = d.step; input.value = params[d.key];
    var val = document.createElement('span');
    val.className = 'val'; val.textContent = params[d.key];
    input.addEventListener('input', function(){
      params[d.key] = Number(input.value);
      val.textContent = input.value;
      saveParams();
    });
    row.appendChild(input); row.appendChild(val);
    host.appendChild(row);
  });
}
buildKnobs();
document.getElementById('copyParams').addEventListener('click', function(){
  var txt = JSON.stringify(params, null, 2);
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
  log('値をコピーした');
});
document.getElementById('resetParams').addEventListener('click', function(){
  params = Object.assign({}, DEFAULTS);
  saveParams(); buildKnobs();
  log('初期値に戻した');
});

/* ===== 今日の1枚（開幕10秒の撮影＋記録JSON） ===== */
document.getElementById('exportBtn').addEventListener('click', function(){
  var cap = caps[caps.length - 1];
  if(!cap){ log('撮影がまだ無い'); return; }
  document.getElementById('exportImg').src = cap.url;
  var meta = {
    kind: 'frag-daily/v1',
    at: new Date().toISOString(),
    openingShotSec: cap.at,
    params: params,
    bodyNote: document.getElementById('bodyNote').value || '',
    noInputDiff: caps.length >= 3 ? {
      d0_3: diffRatio(caps[0].data, caps[1].data),
      d3_10: diffRatio(caps[1].data, caps[2].data)
    } : null,
    taps: state.taps
  };
  document.getElementById('exportJson').value = JSON.stringify(meta, null, 2);
  document.getElementById('exportSheet').classList.add('open');
});
document.getElementById('exportClose').addEventListener('click', function(){
  document.getElementById('exportSheet').classList.remove('open');
});
document.getElementById('exportCopy').addEventListener('click', function(){
  var txt = document.getElementById('exportJson').value;
  if(navigator.clipboard) navigator.clipboard.writeText(txt);
});
fetch('build.txt', { cache:'no-store' }).then(function(r){ return r.text(); }).then(function(t){ window.__build = t.trim(); log('起動 ' + window.__build); }).catch(function(){ log('起動（build未取得）'); });
