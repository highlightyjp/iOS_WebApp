<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<title>自宅配信の設定と診断</title>
<style>
  :root{ --bg:#0e1116; --card:rgba(255,255,255,.08); --card-border:rgba(255,255,255,.14);
    --text:#f2f4f8; --sub:#a7b0bf; --accent:#7dd3fc; --ok:#34d399; --ng:#f87171; }
  @media (prefers-color-scheme: light){
    :root{ --bg:#eef1f6; --card:rgba(255,255,255,.75); --card-border:rgba(20,30,50,.08); --text:#141a24; --sub:#5b6575; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); padding:calc(20px + env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom)); }
  h1{ font-size:20px; margin:0 0 8px; }
  p{ color:var(--sub); font-size:14px; line-height:1.7; margin:0 0 8px; }
  .row{ border:1px solid var(--card-border); background:var(--card); border-radius:16px; padding:16px; margin-top:12px; }
  .row .name{ font-size:15px; font-weight:600; }
  .row .state{ font-size:14px; margin-top:4px; color:var(--sub); line-height:1.6; }
  .row .state.ok{ color:var(--ok); }
  .row .state.ng{ color:var(--ng); }
  #logText{ width:100%; min-height:180px; margin-top:16px; border-radius:12px; border:1px solid var(--card-border);
    background:var(--card); color:var(--text); font-size:12.5px; line-height:1.6; padding:12px; }
  #actionBar{ position:fixed; left:0; right:0; bottom:0; display:flex; gap:12px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--card-border); }
  #actionBar button{ flex:1; padding:14px; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; }
  #actionBar button[disabled]{ opacity:.45; cursor:default; }
  #copyBtn{ border:0; background:var(--accent); color:#082f49; }
  #tapBtn{ margin-top:12px; width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#082f49; font-size:15px; font-weight:700; cursor:pointer; }
  #shareBtn{ border:1px solid var(--card-border); background:var(--card); color:var(--text); }
  #copyMsg{ font-size:13px; color:var(--sub); min-height:18px; margin-top:8px; }
</style>
</head>
<body>
<h1>自宅配信の設定と診断</h1>
<p>設定をこの端末へ保存し、自宅（dynabook）への接続を段階ごとに確認します。結果は下の欄に文章で残ります。</p>
<div class="row"><div class="name">1. 設定の保存</div><div class="state" id="st1">確認中</div></div>
<div class="row"><div class="name">2. 自宅への到達（health）</div><div class="state" id="st2">確認中</div></div>
<div class="row"><div class="name">3. 認証つき取得（音楽の索引）</div><div class="state" id="st3">確認中</div></div>
<div class="row"><div class="name">4. 音源の再生確認</div><div class="state" id="st4">確認中</div><div id="tapSlot"></div></div>
<textarea id="logText" readonly></textarea>
<div id="copyMsg"></div>
<div id="actionBar">
  <button id="copyBtn" type="button" disabled>結果をコピーする</button>
  <button id="shareBtn" type="button" disabled>結果を送る</button>
</div>
<audio id="probe" preload="metadata"></audio>
<script>
(function(){
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
  var LS_BASE = 'suno.audioBase.v1', LS_KEY = 'suno.audioKey.v1';
  // 版の自己照合：Pages の HTML は WebView にキャッシュされるため、build.txt と
  // 照合して古ければ1回だけ読み直す（アイリスモジュールと同じ方式）
  var BUILD = '2026-11-11-0145';
  fetch('build.txt', { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
    if (t.trim() && t.trim() !== BUILD && !sessionStorage.getItem('bootstrap.reloaded')){
      sessionStorage.setItem('bootstrap.reloaded', '1');
      location.reload();
    }
  }).catch(function(){});
  var q = new URLSearchParams(location.search);
  var ab = q.get('ab') || '', ak = q.get('ak') || '';
  var startedAt = new Date();
  var lines = [];
  function set(id, text, cls){ var el = document.getElementById(id); el.textContent = text; el.className = 'state' + (cls ? ' ' + cls : ''); }
  function log(step, text){ lines.push(step + '：' + text); render(); }
  function render(){
    var head = ['自宅配信の設定と診断 結果',
      '日時：' + startedAt.toLocaleString('ja-JP'),
      '端末：' + navigator.userAgent,
      '接続先：' + (ab || '（なし）'),
      ''];
    document.getElementById('logText').value = head.concat(lines).join('\n');
  }
  function finish(){
    document.getElementById('copyBtn').disabled = false;
    document.getElementById('shareBtn').disabled = false;
  }
  function errText(e){ return (e && e.name ? e.name : 'Error') + (e && e.message ? ' / ' + e.message : ''); }
  function timed(promise, ms){
    return Promise.race([promise, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('timeout ' + ms + 'ms')); }, ms); })]);
  }

  // 1. 設定の保存
  if (ab && ak){
    if (ab.charAt(ab.length - 1) !== '/') ab += '/';
    try{
      localStorage.setItem(LS_BASE, ab);
      localStorage.setItem(LS_KEY, ak);
      set('st1', '保存しました', 'ok'); log('1. 設定の保存', '保存しました');
    }catch(e){
      set('st1', '保存できませんでした', 'ng'); log('1. 設定の保存', '保存できませんでした（' + errText(e) + '）');
    }
    if (history.replaceState) history.replaceState(null, '', location.pathname);
  } else {
    try{ ab = localStorage.getItem(LS_BASE) || ''; ak = localStorage.getItem(LS_KEY) || ''; }catch(e){}
    set('st1', ab ? '保存済みの設定を使います' : '設定がまだありません', ab ? 'ok' : 'ng');
    log('1. 設定の保存', ab ? '保存済みの設定を使いました' : '設定がありません');
    render();
  }
  if (!ab){
    set('st2', '設定がないため確認できません', 'ng'); log('2. 到達', '設定なし');
    set('st3', '設定がないため確認できません', 'ng'); log('3. 認証つき取得', '設定なし');
    set('st4', '設定がないため確認できません', 'ng'); log('4. 再生確認', '設定なし');
    finish(); return;
  }

  // 2. 到達（CORS あり → 駄目なら no-cors で「何かは返るか」だけを見る）
  var t2 = performance.now();
  timed(fetch(ab + 'health'), 10000).then(function(r){
    var ms = Math.round(performance.now() - t2);
    set('st2', '届きました（' + r.status + '、' + ms + 'ms）', 'ok');
    log('2. 到達', '届きました（状態 ' + r.status + '、' + ms + 'ms）');
    step3();
  }).catch(function(e){
    var ms = Math.round(performance.now() - t2);
    timed(fetch(ab + 'health', { mode: 'no-cors' }), 8000).then(function(){
      set('st2', '応答は返りましたが内容を読めませんでした（' + ms + 'ms）', 'ng');
      log('2. 到達', '通常の取得は失敗（' + errText(e) + '、' + ms + 'ms）。no-cors では応答あり＝回線は届いている');
      step3();
    }).catch(function(e2){
      set('st2', '届きませんでした（' + ms + 'ms）', 'ng');
      log('2. 到達', '失敗（' + errText(e) + '、' + ms + 'ms）。no-cors でも失敗（' + errText(e2) + '）＝回線か名前解決で止まっている');
      step3();
    });
  });

  // 3. 認証つき取得
  function step3(){
    var t3 = performance.now();
    timed(fetch(ab + 'v1/music-index', { headers: { 'X-API-Key': ak } }), 10000).then(function(r){
      return r.text().then(function(txt){
        var ms = Math.round(performance.now() - t3);
        var count = null;
        try{ count = (JSON.parse(txt).files || []).length; }catch(e){}
        if (r.ok){
          set('st3', '取得できました（音源 ' + count + '件、' + ms + 'ms）', 'ok');
          log('3. 認証つき取得', '取得できました（状態 ' + r.status + '、音源 ' + count + '件、' + ms + 'ms）');
        } else {
          set('st3', '応答はエラーでした（' + r.status + '、' + ms + 'ms）', 'ng');
          log('3. 認証つき取得', '状態 ' + r.status + '（' + ms + 'ms）本文：' + txt.slice(0, 120));
        }
        step4();
      });
    }).catch(function(e){
      var ms = Math.round(performance.now() - t3);
      set('st3', '取得できませんでした（' + ms + 'ms）', 'ng');
      log('3. 認証つき取得', '失敗（' + errText(e) + '、' + ms + 'ms）');
      step4();
    });
  }

  // 4. 音源の再生確認（自動で読みに行き、止まったらタップ＝利用者の操作を起点に切り替える）
  function step4(){
    var SAMPLE = '081db6f4-5e28-4f90-9be0-94445f89c117.mp3';
    var src = ab + 'audio/' + SAMPLE + (ak ? '?k=' + encodeURIComponent(ak) : '');
    var events = [];
    var settled = false;
    var t4 = performance.now();
    var probe = document.getElementById('probe');
    function fin(ok, text){
      if (settled) return; settled = true; clearTimeout(timer);
      var ms = Math.round(performance.now() - t4);
      set('st4', text + '（' + ms + 'ms）', ok ? 'ok' : 'ng');
      log('4. 再生確認', text + '（' + ms + 'ms）イベント：' + (events.join(' → ') || 'なし'));
      finish();
    }
    var timer = setTimeout(function(){
      fin(false, '自動の読み込みでは応答がありませんでした（ネットワーク状態 ' + probe.networkState + '／準備状態 ' + probe.readyState + '）');
    }, 15000);
    ['loadstart', 'loadedmetadata', 'canplay', 'stalled', 'suspend'].forEach(function(ev){
      probe.addEventListener(ev, function(){
        events.push(ev);
        if (ev === 'loadedmetadata') fin(true, '再生できます（長さ ' + Math.round(probe.duration) + '秒の音源を読みました）');
      });
    });
    probe.addEventListener('error', function(){
      var code = probe.error ? probe.error.code : null;
      var names = { 1: '中断', 2: 'ネットワーク', 3: 'デコード', 4: '形式か取得先の問題' };
      events.push('error');
      fin(false, '音源に届きませんでした（エラーコード ' + code + '＝' + (names[code] || '不明') + '）');
    });
    // 自動の読み込みが5秒で進まなければ、タップ確認のボタンを出す（実際のモジュール再生はタップが起点のため、その経路も測る）
    setTimeout(function(){
      if (settled || events.indexOf('loadedmetadata') >= 0) return;
      var slot = document.getElementById('tapSlot');
      if (!slot || slot.firstChild) return;
      var btn = document.createElement('button');
      btn.id = 'tapBtn'; btn.type = 'button'; btn.textContent = 'タップして再生確認する';
      btn.addEventListener('click', function(){
        btn.disabled = true; btn.textContent = '確認中…';
        var a2 = new Audio();
        var ev2 = [];
        var t5 = performance.now();
        var done2 = false;
        function fin2(ok, text){
          if (done2) return; done2 = true; clearTimeout(tm2);
          try{ a2.pause(); }catch(e){}
          var ms = Math.round(performance.now() - t5);
          if (!settled){
            settled = true; clearTimeout(timer);
            set('st4', text + '（タップから ' + ms + 'ms）', ok ? 'ok' : 'ng');
            log('4. 再生確認', text + '（タップから ' + ms + 'ms）イベント：' + (ev2.join(' → ') || 'なし') + '／自動分：' + (events.join(' → ') || 'なし'));
            finish();
          }
        }
        var tm2 = setTimeout(function(){ fin2(false, 'タップしても応答がありませんでした'); }, 12000);
        ['loadstart', 'loadedmetadata', 'playing', 'canplay'].forEach(function(ev){
          a2.addEventListener(ev, function(){
            ev2.push(ev);
            if (ev === 'playing') fin2(true, 'タップで再生できました');
          });
        });
        a2.addEventListener('error', function(){
          var code = a2.error ? a2.error.code : null;
          ev2.push('error');
          fin2(false, 'タップでも届きませんでした（エラーコード ' + code + '）');
        });
        a2.src = src;
        var pr = a2.play();
        if (pr && pr.catch) pr.catch(function(e){ ev2.push('play拒否:' + (e && e.name || '')); });
      });
      slot.appendChild(btn);
    }, 5000);
    probe.src = src;
    if (probe.load) probe.load();
  }

  // 結果の受け渡し（ST-01 の形：下端の固定バー）
  document.getElementById('copyBtn').addEventListener('click', function(){
    var ta = document.getElementById('logText');
    var msg = document.getElementById('copyMsg');
    function done(ok){ msg.textContent = ok ? 'コピーしました。そのままチャットに貼れます。' : 'コピーできませんでした。下の欄を長押しで選んでください。'; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(ta.value).then(function(){ done(true); }, function(){ ta.select(); done(document.execCommand('copy')); });
    } else { ta.select(); done(document.execCommand('copy')); }
  });
  document.getElementById('shareBtn').addEventListener('click', function(){
    var ta = document.getElementById('logText');
    if (navigator.share){
      navigator.share({ title: '自宅配信の設定と診断 結果', text: ta.value }).catch(function(){});
    } else {
      document.getElementById('copyBtn').click();
    }
  });
  render();
})();
</script>
</body>
</html>
