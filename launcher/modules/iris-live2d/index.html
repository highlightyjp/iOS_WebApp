<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>アイリス Live2D 試作（T1 実機確認用）</title>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
    }
    html {
      overscroll-behavior-x: none;
      touch-action: none;
    }
    body {
      display: flex;
      flex-wrap: wrap;
    }
    body > canvas:only-child {
      width: 100vw;
      height: 100vh;
    }
    #fpsmeter {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 10px;
      z-index: 10;
      background: rgba(20, 22, 40, 0.72);
      color: #fff;
      font: 600 15px -apple-system, sans-serif;
      padding: 6px 12px;
      border-radius: 999px;
      pointer-events: none;
    }
    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(20, 22, 40, 0.72);
      color: #fff;
      font: 500 13px -apple-system, sans-serif;
      padding: 6px 14px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
    }
    #testbtn {
      position: fixed;
      right: 10px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      z-index: 11;
      background: rgba(30, 80, 180, 0.9);
      color: #fff;
      font: 600 13px -apple-system, sans-serif;
      padding: 9px 14px;
      border: none;
      border-radius: 999px;
    }
    #testresult {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 52px);
      left: 10px;
      z-index: 10;
      background: rgba(20, 22, 40, 0.85);
      color: #fff;
      font: 500 12px -apple-system, sans-serif;
      padding: 8px 11px;
      border-radius: 8px;
      max-width: 86vw;
      display: none;
      white-space: pre-line;
    }
  </style>
  <!-- Live2DCubismCore script -->
  <script src="./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script type="module" crossorigin src="./assets/index-CjQyo2gc.js"></script>
</head>
<body>
  <div id="fpsmeter">-- fps</div>
  <div id="testresult"></div>
  <div id="hint">ドラッグで顔が向きます</div>
  <button id="testbtn" type="button">テストを実行して送信</button>
  <script>
    (function () {
      var el = document.getElementById('fpsmeter');
      var frames = 0, last = performance.now();
      function tick(now) {
        frames++;
        if (now - last >= 1000) {
          el.textContent = Math.round(frames * 1000 / (now - last)) + ' fps';
          frames = 0; last = now;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
  <script>
    // テストモード（契約 launcher-test/v1）：ボタン1つ、または入口URLの test=1 で実行し、
    // 結果を postMessage で殻へ送る。moduleId は殻の私設一覧から自URLで発見する。
    (function () {
      var PLAYER_BUILD = '2026-11-13-t2';
      var btn = document.getElementById('testbtn');
      var out = document.getElementById('testresult');
      var running = false;

      function discoverModuleId() {
        try {
          var raw = localStorage.getItem('launcher.privateModules.v1');
          if (!raw) return 'iris-live2d';
          var list = JSON.parse(raw);
          var me = location.href.split('#')[0];
          var best = null, bestLen = -1;
          (Array.isArray(list) ? list : []).forEach(function (m) {
            if (!m || !m.url || !m.id) return;
            var u = String(m.url);
            if ((me.indexOf(u) === 0 || u.indexOf(me) === 0) && u.length > bestLen) { best = m.id; bestLen = u.length; }
          });
          return best || 'iris-live2d';
        } catch (e) { return 'iris-live2d'; }
      }

      function findModel() {
        var d = window.lappDelegate;
        if (!d) return null;
        var seen = new Set();
        function walk(o, dep) {
          if (!o || typeof o !== 'object' || seen.has(o) || dep > 5) return null;
          seen.add(o);
          if (typeof o.getModel === 'function' && typeof o.setExpression === 'function') {
            try { var c = o.getModel(); if (c && c.getParameterCount() > 0) return o; } catch (e) {}
          }
          var keys = Object.keys(o);
          for (var i = 0; i < keys.length; i++) {
            try {
              var v = o[keys[i]];
              if (Array.isArray(v)) {
                for (var j = 0; j < v.length; j++) { var r = walk(v[j], dep + 1); if (r) return r; }
              } else { var r2 = walk(v, dep + 1); if (r2) return r2; }
            } catch (e) {}
          }
          return null;
        }
        return walk(d, 0);
      }

      function waitModel(timeoutMs) {
        return new Promise(function (resolve) {
          var t0 = Date.now();
          (function poll() {
            var m = findModel();
            if (m) return resolve(m);
            if (Date.now() - t0 > timeoutMs) return resolve(null);
            setTimeout(poll, 400);
          })();
        });
      }

      function measureFps(ms) {
        return new Promise(function (resolve) {
          var n = 0, t0 = performance.now();
          function loop() {
            n++;
            if (performance.now() - t0 < ms) requestAnimationFrame(loop);
            else resolve(Math.round(n * 1000 / (performance.now() - t0)));
          }
          requestAnimationFrame(loop);
        });
      }

      function paramIndexMap(core) {
        // getParameterIndex はこのモデルで信頼できない（実測）。ID一覧から対応表を作る。
        var map = {};
        try {
          var n = core.getParameterCount();
          for (var i = 0; i < n; i++) {
            var pid = core.getParameterId(i);
            var s = (pid && pid._id) ? pid._id : String(pid);
            if (s) map[s] = i;
          }
        } catch (e) {}
        return map;
      }

      function paramValue(core, map, id) {
        try {
          var i = map[id];
          if (i === undefined) return null;
          var v = core.getParameterValueByIndex(i);
          return (v === null || v === undefined) ? null : v;
        } catch (e) { return null; }
      }

      function showResult(lines) {
        out.style.display = 'block';
        out.textContent = lines.join('\n');
      }

      async function runTest() {
        if (running) return;
        running = true;
        btn.disabled = true;
        btn.textContent = 'テスト中…';
        var items = [];
        function add(id, gate, label, result, detail, ms) {
          items.push({ id: id, gate: !!gate, label: label, result: result, detail: detail || '', ms: ms || 0 });
        }
        var t0 = Date.now();
        var model = await waitModel(25000);
        add('M1', true, 'モデル読み込み', model ? 'pass' : 'fail',
          model ? 'ドローアブル到達' : '25秒以内にモデルが見つからない', Date.now() - t0);

        var canvas = document.querySelector('canvas');
        add('M2', true, '描画（canvas）', canvas ? 'pass' : 'fail',
          canvas ? (canvas.width + 'x' + canvas.height) : 'canvas なし', 0);

        var fps = await measureFps(3000);
        add('M3', true, 'フレームレート', fps >= 30 ? 'pass' : 'fail', fps + ' fps（3秒計測）', 3000);

        var exprCount = -1, motionGroups = -1;
        try {
          var mj = await (await fetch('./Resources/iris-t1/iris-t1.model3.json')).json();
          var refs = mj.FileReferences || {};
          exprCount = (refs.Expressions || []).length;
          motionGroups = Object.keys(refs.Motions || {}).length;
        } catch (e) {}
        add('M4', false, '表情の数', exprCount > 0 ? 'pass' : 'na',
          exprCount >= 0 ? (exprCount + ' 種') : 'model3 が読めない', 0);

        var breathMoved = 'na', angleDetail = 'パラメータなし';
        if (model) {
          var core = model.getModel();
          var pmap = paramIndexMap(core);
          var ax = paramValue(core, pmap, 'ParamAngleX');
          var b1 = paramValue(core, pmap, 'ParamBreath');
          await new Promise(function (r) { setTimeout(r, 1300); });
          var b2 = paramValue(core, pmap, 'ParamBreath');
          angleDetail = (ax === null) ? 'ParamAngleX なし' : 'ParamAngleX あり';
          if (b1 !== null && b2 !== null) breathMoved = (Math.abs(b2 - b1) > 0.0001) ? 'pass' : 'fail';
        }
        add('M5', false, '顔の向きパラメータ', model ? 'pass' : 'na', angleDetail, 0);
        add('M6', false, 'モーション再生（呼吸の変化）', breathMoved,
          breathMoved === 'pass' ? '待機モーション駆動中' : '変化を検出できない', 1300);

        var summary = { pass: 0, fail: 0, na: 0 };
        items.forEach(function (i) { summary[i.result]++; });
        var msg = {
          contract: 'launcher-test/v1',
          moduleId: discoverModuleId(),
          version: PLAYER_BUILD,
          items: items,
          perf: { fps: fps },
          untouched: { checked: true, same: true },
          summary: summary
        };
        try { window.parent.postMessage(msg, '*'); } catch (e) {}
        var head = 'テスト結果：合格 ' + summary.pass + '／不合格 ' + summary.fail + '／対象外 ' + summary.na;
        var lines = [head].concat(items.map(function (i) {
          return (i.result === 'pass' ? '○ ' : i.result === 'fail' ? '× ' : '− ') + i.label + '：' + i.detail;
        }));
        lines.push('殻へ送信しました（単独で開いている場合は画面表示のみ）');
        showResult(lines);
        btn.disabled = false;
        btn.textContent = 'テストを実行して送信';
        running = false;
      }

      btn.addEventListener('click', runTest);
      if (new URLSearchParams(location.search).get('test') === '1') {
        setTimeout(runTest, 800);
      }
    })();
  </script>
</body>
</html>
