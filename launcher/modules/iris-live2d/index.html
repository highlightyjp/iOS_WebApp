<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>アイリス Live2D 試作（T1 実機確認用）</title>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
    }
    html {
      overscroll-behavior-x: none;
      touch-action: none;
    }
    body {
      display: flex;
      flex-wrap: wrap;
    }
    body > canvas:only-child {
      width: 100vw;
      height: 100vh;
    }
    #fpsmeter {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 10px;
      z-index: 10;
      background: rgba(20, 22, 40, 0.72);
      color: #fff;
      font: 600 15px -apple-system, sans-serif;
      padding: 6px 12px;
      border-radius: 999px;
      pointer-events: none;
    }
    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(20, 22, 40, 0.72);
      color: #fff;
      font: 500 13px -apple-system, sans-serif;
      padding: 6px 14px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
    }
    #status {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 52px);
      left: 10px;
      z-index: 10;
      background: rgba(120, 40, 40, 0.85);
      color: #fff;
      font: 500 12px -apple-system, sans-serif;
      padding: 6px 10px;
      border-radius: 8px;
      pointer-events: none;
      max-width: 86vw;
      display: none;
    }
  </style>
  <!-- Live2DCubismCore script -->
  <script src="./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script type="module" crossorigin src="./assets/index-CjQyo2gc.js"></script>
</head>
<body>
  <div id="fpsmeter">-- fps</div>
  <div id="status"></div>
  <div id="hint">ドラッグで顔が向きます</div>
  <script>
    (function () {
      var el = document.getElementById('fpsmeter');
      var frames = 0, last = performance.now();
      function tick(now) {
        frames++;
        if (now - last >= 1000) {
          el.textContent = Math.round(frames * 1000 / (now - last)) + ' fps';
          frames = 0; last = now;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
  <script>
    // 描画が始まらない場合の切り分け用：状態を自己申告する（モデルが出たら消える）
    (function () {
      var st = document.getElementById('status');
      var startedAt = Date.now();
      var lastError = '';
      function show(msg) { st.style.display = 'block'; st.textContent = msg; }
      window.addEventListener('error', function (e) {
        lastError = 'エラー: ' + (e.message || '不明なエラー');
      }, true);
      ['error', 'warn'].forEach(function (level) {
        var orig = console[level].bind(console);
        console[level] = function () {
          try {
            var msg = Array.prototype.map.call(arguments, function (a) { return String(a); }).join(' ');
            if (msg) lastError = level + ': ' + msg.slice(0, 120);
          } catch (e) {}
          orig.apply(null, arguments);
        };
      });
      function findModel() {
        var d = window.lappDelegate;
        if (!d) return null;
        var seen = new Set();
        function walk(o, dep) {
          if (!o || typeof o !== 'object' || seen.has(o) || dep > 5) return null;
          seen.add(o);
          if (typeof o.getModel === 'function' && typeof o.setExpression === 'function') {
            try { var c = o.getModel(); if (c && c.getParameterCount() > 0) return o; } catch (e) {}
          }
          var keys = Object.keys(o);
          for (var i = 0; i < keys.length; i++) {
            try {
              var v = o[keys[i]];
              if (Array.isArray(v)) {
                for (var j = 0; j < v.length; j++) { var r = walk(v[j], dep + 1); if (r) return r; }
              } else { var r2 = walk(v, dep + 1); if (r2) return r2; }
            } catch (e) {}
          }
          return null;
        }
        return walk(d, 0);
      }
      var okSince = 0;
      var timer = setInterval(function () {
        var canvas = document.querySelector('canvas');
        var names = [];
        try {
          performance.getEntriesByType('resource').forEach(function (r) { names.push(r.name); });
        } catch (e) {}
        var moc = names.some(function (n) { return n.indexOf('iris-t1.moc3') >= 0; });
        var sec = Math.round((Date.now() - startedAt) / 1000);
        var m = findModel();
        if (m && !lastError) {
          if (!okSince) okSince = Date.now();
          if (Date.now() - okSince > 5000) { st.style.display = 'none'; clearInterval(timer); return; }
        }
        var line = '読込 ' + sec + '秒：' + (canvas ? 'canvas有' : 'canvas未') + '／' + (moc ? 'モデル有' : 'モデル未');
        if (canvas) line += '／画面 ' + window.innerWidth + 'x' + window.innerHeight + ' dpr' + window.devicePixelRatio;
        if (m) {
          line += '／モデル検出';
          try {
            var mm = m.getModelMatrix ? m.getModelMatrix() : null;
            if (mm) line += ' scale' + mm.getScaleX().toFixed(2) + ' x' + mm.getTranslateX().toFixed(2) + ' y' + mm.getTranslateY().toFixed(2);
          } catch (e) {}
        }
        if (lastError) line += '／' + lastError;
        show(line);
      }, 2000);
    })();
  </script>
</body>
</html>
