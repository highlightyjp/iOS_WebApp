<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>アイリス Live2D 試作（T1 実機確認用）</title>
  <style>
    html, body {
      overflow: hidden;
      margin: 0;
    }
    html {
      overscroll-behavior-x: none;
      touch-action: none;
    }
    body {
      display: flex;
      flex-wrap: wrap;
    }
    body > canvas:only-child {
      width: 100vw;
      height: 100vh;
    }
    #fpsmeter {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      left: 10px;
      z-index: 10;
      background: rgba(20, 22, 40, 0.72);
      color: #fff;
      font: 600 15px -apple-system, sans-serif;
      padding: 6px 12px;
      border-radius: 999px;
      pointer-events: none;
    }
    #hint {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(20, 22, 40, 0.72);
      color: #fff;
      font: 500 13px -apple-system, sans-serif;
      padding: 6px 14px;
      border-radius: 999px;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
  <!-- Live2DCubismCore script -->
  <script src="./Core/live2dcubismcore.js"></script>
  <!-- Build script -->
  <script type="module" crossorigin src="./assets/index-Y5OCC_ko.js"></script>
</head>
<body>
  <div id="fpsmeter">-- fps</div>
  <div id="hint">ドラッグで顔が向きます</div>
  <script>
    (function () {
      var el = document.getElementById('fpsmeter');
      var frames = 0, last = performance.now();
      function tick(now) {
        frames++;
        if (now - last >= 1000) {
          el.textContent = Math.round(frames * 1000 / (now - last)) + ' fps';
          frames = 0; last = now;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
