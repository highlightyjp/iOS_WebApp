<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>アイリス</title>
<style>
  :root{
    color-scheme: light dark;
    --app-h:100dvh;
    --bg:#f4efe9;
    --bg2:#ece3da;
    --ink:#33262b;
    --sub:#7d6d74;
    --line:rgba(90,60,70,.16);
    --bubble-iris:#ffffff;
    --bubble-user:#4a3540;
    --bubble-user-ink:#fdf6f1;
    --accent:#b85c48;
    --accent-soft:#e9c9bd;
    --glass:rgba(255,252,249,.72);
    --glass-line:rgba(120,85,95,.22);
    --shadow:0 10px 30px rgba(80,50,55,.14);
    --stage-bg:linear-gradient(180deg,#f8f2ec 0%,#efe4da 70%,#e9dbcf 100%);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161318;
      --bg2:#1e191f;
      --ink:#f0e7e1;
      --sub:#a7959f;
      --line:rgba(230,205,215,.16);
      --bubble-iris:#2a232b;
      --bubble-user:#c9856f;
      --bubble-user-ink:#1d1410;
      --accent:#e0997f;
      --accent-soft:#5a3a32;
      --glass:rgba(32,27,34,.66);
      --glass-line:rgba(230,205,215,.2);
      --shadow:0 10px 30px rgba(0,0,0,.45);
      --stage-bg:linear-gradient(180deg,#241e28 0%,#1d1822 70%,#181318 100%);
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; width:100%; overflow-x:hidden;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow:hidden;
    overflow-x:hidden;
  }
  #app{height:var(--app-h,100dvh); display:flex; flex-direction:column; width:100%; max-width:640px; margin:0 auto; background:var(--bg); overflow:hidden; overflow-x:hidden;}

  /* ---------- ステージ ---------- */
  #stageArea{
    position:relative; flex:0 0 auto; height:calc(var(--app-h,100dvh) * 0.46); min-height:200px;
    background:var(--stage-bg);
    overflow:hidden;
    transition:height .3s cubic-bezier(.4,0,.2,1);
  }
  #app.full #stageArea{height:calc(var(--app-h,100dvh) * 0.56);}
  #app.kb #stageArea{height:calc(var(--app-h,100dvh) * 0.30); min-height:132px;}
  #app.kb.full #stageArea{height:calc(var(--app-h,100dvh) * 0.34); min-height:132px;}
  #stage{position:absolute; inset:0; cursor:pointer;}
  #stage img,#stage canvas{position:absolute; display:block;}
  /* 顔アップ（既定）: 高さ基準で拡縮し、顔全体（口まで）が必ず収まる構図にする */
  #stage img,#stage canvas{
    width:auto; max-width:none; height:385%; aspect-ratio:560/1120;
    left:50%; top:-16%;
    transform:translateX(-50.2%);
  }
  /* 全身: 高さいっぱいに収める */
  #app.full #stage img,#app.full #stage canvas{
    width:auto; height:102%; top:-1%;
    transform:translateX(-50%);
  }
  #stageGlow{
    position:absolute; inset:auto 0 0 0; height:28px; pointer-events:none;
    background:linear-gradient(180deg,transparent,var(--bg));
  }
  #presence{
    position:absolute; left:14px; bottom:10px; pointer-events:none;
    font-size:12px; color:var(--sub); letter-spacing:.04em;
    display:flex; align-items:center; gap:6px;
  }
  #presence .dot{width:7px; height:7px; border-radius:50%; background:#7fae7a; box-shadow:0 0 0 3px rgba(127,174,122,.18);}
  #viewToggle{
    position:absolute; right:12px; top:calc(10px + env(safe-area-inset-top));
    border:1px solid var(--glass-line); background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(1.3); backdrop-filter:blur(14px) saturate(1.3);
    color:var(--ink); font-size:12.5px; padding:7px 14px; border-radius:999px;
    cursor:pointer; box-shadow:var(--shadow); font-family:inherit;
  }
  #viewToggle:active{transform:scale(.96);}

  /* ---------- チャット ---------- */
  #chatWrap{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; min-width:0; width:100%; background:var(--bg); overflow:hidden;}
  #chat{
    flex:1 1 auto; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    padding:22px 14px 8px; display:flex; flex-direction:column; gap:10px;
    -webkit-overflow-scrolling:touch; width:100%; min-width:0;
  }
  .row{display:flex; flex-direction:column; max-width:86%; min-width:0;}
  .row.iris{align-self:flex-start; align-items:flex-start;}
  .row.me{align-self:flex-end; align-items:flex-end;}
  .who{font-size:10.5px; color:var(--sub); margin:0 4px 3px; letter-spacing:.06em;}
  .note{font-size:10.5px; color:var(--sub); margin:3px 4px 0;}
  .bubble{
    padding:9px 13px; border-radius:18px; font-size:14.5px; line-height:1.65;
    white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere; max-width:100%; min-width:0;
  }
  .row.iris .bubble{background:var(--bubble-iris); color:var(--ink); border-bottom-left-radius:6px; box-shadow:0 2px 10px rgba(90,55,60,.08); border:1px solid var(--line);}
  .row.me .bubble{background:var(--bubble-user); color:var(--bubble-user-ink); border-bottom-right-radius:6px;}
  .bubble.typing{display:inline-flex; gap:5px; padding:13px 15px;}
  .bubble.typing i{width:6px; height:6px; border-radius:50%; background:var(--sub); opacity:.5; animation:tp 1.1s infinite;}
  .bubble.typing i:nth-child(2){animation-delay:.18s;}
  .bubble.typing i:nth-child(3){animation-delay:.36s;}
  @keyframes tp{0%,60%,100%{transform:translateY(0); opacity:.4;} 30%{transform:translateY(-3px); opacity:.9;}}
  .dayline{align-self:center; font-size:11px; color:var(--sub); padding:2px 10px;}

  /* ---------- 入力まわり（ガラスは操作層だけ） ---------- */
  #dock{
    flex:0 0 auto; padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(1.35); backdrop-filter:blur(18px) saturate(1.35);
    border-top:1px solid var(--glass-line);
  }
  #chips{display:flex; flex-wrap:wrap; gap:7px; padding:2px 0 9px;}
  #chips button{
    flex:0 0 auto; font-family:inherit; font-size:12.5px; color:var(--ink);
    background:transparent; border:1px solid var(--glass-line); border-radius:999px;
    padding:6px 13px; cursor:pointer;
  }
  #chips button:active{background:var(--accent-soft);}
  #composer{display:flex; gap:8px; align-items:flex-end; width:100%; min-width:0;}
  #input{
    flex:1 1 auto; min-width:0; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--bubble-iris); border:1px solid var(--line); border-radius:20px;
    padding:10px 15px; resize:none; max-height:96px; line-height:1.45; outline:none;
  }
  #input:focus{border-color:var(--accent);}
  #input::placeholder{color:var(--sub);}
  #send{
    flex:0 0 auto; width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-size:17px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  #send:active{transform:scale(.93);}
  #send:disabled{opacity:.45;}
  #dock{width:100%; min-width:0; overflow-x:hidden;}
  #chips{max-width:100%;}
  /* ---------- つなぎ先の設定（目立たない導線） ---------- */
  #connBtn{
    position:absolute; left:12px; top:calc(10px + env(safe-area-inset-top));
    border:none; background:transparent; color:var(--sub);
    font-size:11px; padding:6px 8px; cursor:pointer; font-family:inherit;
    opacity:.55; letter-spacing:.04em;
  }
  #connBtn:active{opacity:1;}
  #connPanel{
    position:fixed; inset:0; z-index:40; display:none;
    align-items:flex-end; justify-content:center;
    background:rgba(20,12,16,.38);
  }
  #connPanel.open{display:flex;}
  #connSheet{
    width:100%; max-width:640px; background:var(--bubble-iris); color:var(--ink);
    border-radius:18px 18px 0 0; padding:18px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow); max-height:calc(var(--app-h,100dvh) * 0.92); overflow-y:auto;
  }
  #connSheet h2{font-size:15px; margin:0 0 6px; font-weight:600;}
  #connSheet p{font-size:12.5px; line-height:1.6; color:var(--sub); margin:0 0 14px;}
  #connSheet label{display:block; font-size:12.5px; color:var(--sub); margin:0 0 5px;}
  #connSheet input{
    width:100%; font-family:inherit; font-size:16px; color:var(--ink);
    background:var(--bg); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin:0 0 12px; outline:none; min-width:0;
  }
  #connSheet input:focus{border-color:var(--accent);}
  #connActions{display:flex; gap:8px; flex-wrap:wrap; margin-top:2px;}
  #connActions button{
    font-family:inherit; font-size:13.5px; padding:9px 16px; border-radius:999px; cursor:pointer;
    border:1px solid var(--glass-line); background:transparent; color:var(--ink);
  }
  #connSave{background:var(--accent) !important; border-color:transparent !important; color:#fff !important;}
  #connMsg{font-size:12.5px; color:var(--sub); margin:10px 0 0; min-height:1.2em; line-height:1.5;}
  /* ---------- テストモード入口 ---------- */
  #testEntry{margin-top:16px; padding-top:14px; border-top:1px solid var(--line);}
  #testOpenBtn{
    font-family:inherit; font-size:12.5px; color:var(--sub); background:transparent;
    border:1px solid var(--glass-line); border-radius:999px; padding:7px 16px; cursor:pointer;
  }
  #testOpenBtn:active{color:var(--ink);}
  #testEntry p{font-size:11.5px; color:var(--sub); margin:7px 0 0; line-height:1.55;}
  /* ---------- テストモード ---------- */
  #testOverlay{
    position:fixed; inset:0; z-index:60; display:none;
    background:var(--bg); color:var(--ink); overflow-y:auto; overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
  }
  #testOverlay.open{display:block;}
  #testInner{max-width:640px; margin:0 auto; padding:calc(16px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));}
  #testInner h2{font-size:17px; margin:0 0 4px; font-weight:600;}
  #testSub{font-size:12.5px; color:var(--sub); line-height:1.6; margin:0 0 14px;}
  #testProgressWrap{height:6px; border-radius:3px; background:var(--bg2); overflow:hidden; margin:0 0 14px;}
  #testProgress{height:100%; width:0%; background:var(--accent); border-radius:3px; transition:width .3s ease;}
  #testNow{font-size:13px; color:var(--ink); margin:0 0 10px; min-height:1.4em; line-height:1.5;}
  .trow{
    display:flex; align-items:flex-start; gap:9px; padding:9px 11px; margin:0 0 7px;
    background:var(--bubble-iris); border:1px solid var(--line); border-radius:12px;
  }
  .tmark{
    flex:0 0 auto; width:20px; height:20px; border-radius:50%; margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    font-size:11.5px; line-height:1; border:1px solid var(--glass-line); color:var(--sub); background:transparent;
  }
  .trow.run .tmark{border-color:var(--accent); color:var(--accent);}
  .trow.ok .tmark{background:#7fae7a; border-color:transparent; color:#fff;}
  .trow.ng .tmark{background:#b84a3a; border-color:transparent; color:#fff;}
  .trow.na .tmark{background:var(--sub); border-color:transparent; color:#fff;}
  .tbody{flex:1 1 auto; min-width:0;}
  .tname{font-size:13.5px; line-height:1.45;}
  .tdetail{font-size:12px; color:var(--sub); line-height:1.55; margin-top:2px; word-break:break-word; overflow-wrap:anywhere;}
  #testResult{display:none; margin-top:16px;}
  #testResult.show{display:block;}
  #testSummary{
    font-size:14px; line-height:1.65; padding:12px 13px; margin:0 0 12px;
    background:var(--bubble-iris); border:1px solid var(--line); border-radius:12px; white-space:pre-wrap; word-break:break-word;
  }
  #testComposite{width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:12px; background:#fff;}
  #testText{
    width:100%; font-family:inherit; font-size:12.5px; line-height:1.6; color:var(--ink);
    background:var(--bubble-iris); border:1px solid var(--line); border-radius:12px;
    padding:11px 12px; margin:12px 0 0; resize:vertical; min-height:120px;
  }
  #testActions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  #testActions button{
    font-family:inherit; font-size:13.5px; padding:9px 16px; border-radius:999px; cursor:pointer;
    border:1px solid var(--glass-line); background:transparent; color:var(--ink);
  }
  #testCopy{background:var(--accent) !important; border-color:transparent !important; color:#fff !important;}
  #testQuickActions{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  #testQuickActions button{
    font-family:inherit; font-size:13.5px; padding:9px 16px; border-radius:999px; cursor:pointer;
    border:1px solid var(--glass-line); background:transparent; color:var(--ink);
  }
  #testCopyTop{background:var(--accent) !important; border-color:transparent !important; color:#fff !important;}
  #testBar{position:sticky; bottom:0; display:flex; gap:8px; flex-wrap:wrap; padding:10px 0 2px; background:var(--bg); z-index:5;}
  #testBar button{
    font-family:inherit; font-size:13.5px; padding:9px 16px; border-radius:999px; cursor:pointer;
    border:1px solid var(--glass-line); background:transparent; color:var(--ink);
  }
  #testBar button:disabled{opacity:0.45; cursor:default;}
  #testCopyBar{background:var(--accent) !important; border-color:transparent !important; color:#fff !important;}
  #testCopyBar:disabled{background:transparent !important; color:var(--sub) !important; border-color:var(--glass-line) !important;}
  #testMsg{font-size:12.5px; color:var(--sub); margin:10px 0 0; min-height:1.2em; line-height:1.5;}
  /* ---------- 画像保存用オーバーレイ（長押し保存） ---------- */
  #saveOverlay{
    position:fixed; inset:0; z-index:80; display:none;
    background:rgba(12,8,10,.96); color:#f7f1ea;
    flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch;
  }
  #saveOverlay.open{display:flex;}
  #saveBar{
    flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:calc(12px + env(safe-area-inset-top)) 16px 10px;
  }
  #saveHint{font-size:14px; line-height:1.5; margin:0; font-weight:600;}
  #saveSub{font-size:12px; line-height:1.5; margin:2px 0 0; opacity:.75;}
  #saveClose{
    flex:0 0 auto; font-family:inherit; font-size:13.5px; padding:9px 16px; border-radius:999px; cursor:pointer;
    border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.1); color:#fff;
  }
  #saveClose:active{background:rgba(255,255,255,.22);}
  #saveImgWrap{flex:1 1 auto; display:flex; align-items:flex-start; justify-content:center; padding:6px 12px calc(20px + env(safe-area-inset-bottom));}
  #saveFullImg{
    display:block; width:100%; max-width:640px; height:auto; background:#fff; border-radius:8px;
    -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto; touch-action:manipulation;
  }
  @media (prefers-reduced-motion: reduce){
    #testProgress{transition:none;}
  }
  @media (prefers-reduced-motion: reduce){
    #stageArea{transition:none;}
    .bubble.typing i{animation:none;}
  }
</style>
<script>document.addEventListener('gesturestart',function(e){e.preventDefault();});</script>
</head>

<script>
"use strict";
/* ================================================================
   表示領域 — キーボード表示時は visualViewport の高さに追随し、
   アバターと入力欄が可視領域に収まるようにする。ピンチズームは妨げない。
   ================================================================ */
(function initViewport(){
  var appEl = document.getElementById("app");
  var baseH = window.innerHeight || 0;
  function apply(){
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    if(!h) return;
    if(h > baseH) baseH = h;
    document.documentElement.style.setProperty("--app-h", h + "px");
    if(appEl) appEl.classList.toggle("kb", baseH - h > 120);
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize", apply);
    window.visualViewport.addEventListener("scroll", apply);
  }
  window.addEventListener("resize", apply);
  window.addEventListener("orientationchange", function(){ baseH = window.innerHeight || baseH; setTimeout(apply, 80); });
  apply();
})();

function g1(v, c, s){ const d = (v - c) / s; return Math.exp(-d * d); }

    const grow = Math.pow(Math.max(0, (y - HAIR_ROOT_Y) / 700), 1.2);
    dx += P.sway * 5.0 * wH * grow;
    dy += Math.abs(P.sway) * 0.8 * wH * grow;
  }
  const pin = Math.min(
    sstep(x, 0, 10), sstep(W - x, 0, 10),
    sstep(y, 0, 10), sstep(H - y, 0, 10));
  return [x + dx * pin, y + dy * pin];
}

let canvas = document.createElement("canvas");
canvas.width = W * 2; canvas.height = H * 2;
canvas.setAttribute("role","img");
canvas.setAttribute("aria-label","アイリス");
let gl = null;
try{ gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: true, alpha: false }); }catch(e){ gl = null; }
let ctx = gl ? null : canvas.getContext("2d");
let texImg = null, canvasLive = false;

function drawTri(sx0, sy0, sx1, sy1, sx2, sy2, d0, d1, d2){
  /* 高解像度版：ソース（テクスチャ尺度）も宛先（キャンバス尺度）も×2 */
  sx0 *= 2; sy0 *= 2; sx1 *= 2; sy1 *= 2; sx2 *= 2; sy2 *= 2;
  let dx0 = d0[0] * 2, dy0 = d0[1] * 2, dx1 = d1[0] * 2, dy1 = d1[1] * 2, dx2 = d2[0] * 2, dy2 = d2[1] * 2;
  const gx = (dx0 + dx1 + dx2) / 3, gy = (dy0 + dy1 + dy2) / 3;
  dx0 += (dx0 - gx) * 0.05; dy0 += (dy0 - gy) * 0.05;
  dx1 += (dx1 - gx) * 0.05; dy1 += (dy1 - gy) * 0.05;
  dx2 += (dx2 - gx) * 0.05; dy2 += (dy2 - gy) * 0.05;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(dx0, dy0); ctx.lineTo(dx1, dy1); ctx.lineTo(dx2, dy2);
  ctx.closePath(); ctx.clip();
  const denom = (sx1 - sx0) * (sy2 - sy0) - (sx2 - sx0) * (sy1 - sy0);
  const a = ((dx1 - dx0) * (sy2 - sy0) - (dx2 - dx0) * (sy1 - sy0)) / denom;
  const b = ((dy1 - dy0) * (sy2 - sy0) - (dy2 - dy0) * (sy1 - sy0)) / denom;
  const c = ((dx2 - dx0) * (sx1 - sx0) - (dx1 - dx0) * (sx2 - sx0)) / denom;
  const d = ((dy2 - dy0) * (sx1 - sx0) - (dy1 - dy0) * (sx2 - sx0)) / denom;
  const e = dx0 - a * sx0 - c * sy0;
  const f = dy0 - b * sx0 - d * sy0;
  ctx.setTransform(a, b, c, d, e, f);
  const bx = Math.max(0, Math.min(sx0, sx1, sx2) - 2);
  const by = Math.max(0, Math.min(sy0, sy1, sy2) - 2);
  const bw = Math.min(W * 2, Math.max(sx0, sx1, sx2) + 2) - bx;
  const bh = Math.min(H * 2, Math.max(sy0, sy1, sy2) + 2) - by;
  ctx.drawImage(texImg, bx, by, bw, bh, bx, by, bw, bh);
  ctx.restore();
}
function render2D(P){
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W * 2, H * 2);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W * 2, H * 2);
  const pts = [];
  for(let j = 0; j <= NY; j++){
    pts.push([]);
    for(let i = 0; i <= NX; i++) pts[j].push(deform(XS[i], YS[j], P));
  }
  for(let j = 0; j < NY; j++){
    for(let i = 0; i < NX; i++){
      const x0 = XS[i], x1 = XS[i + 1], y0 = YS[j], y1 = YS[j + 1];
      const p00 = pts[j][i], p10 = pts[j][i + 1], p01 = pts[j + 1][i], p11 = pts[j + 1][i + 1];
      drawTri(x0, y0, x1, y0, x0, y1, p00, p10, p01);
      drawTri(x1, y0, x1, y1, x0, y1, p10, p11, p01);
    }
  }
}

/* ---- WebGL ワープ：変形の計算と解像度は 2D 版と同一で、描く所だけ GPU に任せる ---- */
let glProg = null, glTex = null, glPosBuf = null;
let glIdxCount = 0;
const glPosData = new Float32Array(XS.length * YS.length * 2);
function initGL(){
  if(!gl || !texImg) return false;
  try{
    const vs = "attribute vec2 aPos; attribute vec2 aUv; varying vec2 vUv;" +
      "void main(){ vUv = aUv; gl_Position = vec4(aPos.x / 1120.0 * 2.0 - 1.0, 1.0 - aPos.y / 2240.0 * 2.0, 0.0, 1.0); }";
    const fs = "precision mediump float; varying vec2 vUv; uniform sampler2D uTex;" +
      "void main(){ gl_FragColor = texture2D(uTex, vUv); }";
    function sh(type, src){ const q = gl.createShader(type); gl.shaderSource(q, src); gl.compileShader(q); return q; }
    const pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(pr);
    if(!gl.getProgramParameter(pr, gl.LINK_STATUS)) return false;
    gl.useProgram(pr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const uv = new Float32Array(XS.length * YS.length * 2);
    let k = 0;
    for(let j = 0; j < YS.length; j++) for(let i = 0; i < XS.length; i++){ uv[k++] = XS[i] / W; uv[k++] = YS[j] / H; }
    const uvBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf);
    gl.bufferData(gl.ARRAY_BUFFER, uv, gl.STATIC_DRAW);
    const aUv = gl.getAttribLocation(pr, "aUv");
    gl.enableVertexAttribArray(aUv);
    gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);
    const idx = [];
    for(let j = 0; j < NY; j++) for(let i = 0; i < NX; i++){
      const a = j * XS.length + i, b = a + 1, c = a + XS.length, d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(idx), gl.STATIC_DRAW);
    glIdxCount = idx.length;
    glPosBuf = gl.createBuffer();
    const aPos = gl.getAttribLocation(pr, "aPos");
    gl.enableVertexAttribArray(aPos);
    gl.bindBuffer(gl.ARRAY_BUFFER, glPosBuf);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    glTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, texImg);
    gl.clearColor(1, 1, 1, 1);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    glProg = pr;
    return true;
  }catch(e){ return false; }
}
function renderGL(P){
  let k = 0;
  for(let j = 0; j <= NY; j++) for(let i = 0; i <= NX; i++){
    const d = deform(XS[i], YS[j], P);
    glPosData[k++] = d[0] * 2; glPosData[k++] = d[1] * 2;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, glPosBuf);
  gl.bufferData(gl.ARRAY_BUFFER, glPosData, gl.DYNAMIC_DRAW);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawElements(gl.TRIANGLES, glIdxCount, gl.UNSIGNED_SHORT, 0);
}
function render(P){ if(glProg) renderGL(P); else render2D(P); }

let nextBlink = 1.6, blinkStart = -1;
const BLINK_DUR = 0.17;
let last = performance.now(), t0 = last, lastDrawAt = 0, lastFrameAt = 0;
let sway = 0, swayVel = 0, prevTiltRad = 0;
let emotionHoldUntil = 0;

function buildParams(t, blinkClose){
  const tiltRad = (cur.tilt + Math.sin(t * 0.30) * 0.36) * Math.PI / 180;
  return {
    ep: exprParams(blinkClose),
    tiltRad: tiltRad,
    headTX: Math.sin(t * 0.21 + 1.3) * 0.56,
    headTY: Math.cos(t * 0.26) * 0.56 + cur.longing * 2.0,
    breath: Math.sin(t * (2 * Math.PI / 3.9)),
    sway: sway
  };
}
function frameBody(now){
  const t = (now - t0) / 1000;
  let dt = Math.min(Math.max((now - last) / 1000, 0), 0.25); last = now;
  for(const a of AXES){
    const rate = tgt[a] > cur[a] ? RATE_IN[a] : RATE_OUT[a];
    cur[a] += (tgt[a] - cur[a]) * (1 - Math.exp(-rate * dt));
    if(Math.abs(tgt[a] - cur[a]) < 0.0015) cur[a] = tgt[a];
  }
  { const d = tgt.tilt - cur.tilt;
    cur.tilt += d * (1 - Math.exp(-2.2 * dt));
    if(Math.abs(d) < 0.02) cur.tilt = tgt.tilt; }
  let blinkClose = 0;
  if(t >= nextBlink && blinkStart < 0){ blinkStart = t; nextBlink = t + 2.4 + Math.random() * 3.2; }
  if(blinkStart >= 0){
    const p = (t - blinkStart) / BLINK_DUR;
    if(p >= 1) blinkStart = -1;
    else blinkClose = Math.sin(Math.PI * p);
  }
  const tiltRadNow = (cur.tilt + Math.sin(t * 0.30) * 0.36) * Math.PI / 180;
  const tiltVel = dt > 0 ? (tiltRadNow - prevTiltRad) / dt : 0;
  prevTiltRad = tiltRadNow;
  if(dt > 0){
    const drive = -tiltVel * 0.55 + Math.sin(t * 0.7) * 0.05 + Math.sin(t * 1.13 + 1.7) * 0.03;
    swayVel += (-7.0 * sway - 1.9 * swayVel + drive * 3.0) * dt;
    sway += swayVel * dt;
    if(sway > 1) sway = 1; else if(sway < -1) sway = -1;
  }
  const transitioning =
    AXES.some(a => Math.abs(tgt[a] - cur[a]) > 0.002) ||
    Math.abs(tgt.tilt - cur.tilt) > 0.02;
  if(transitioning || blinkStart >= 0 || now - lastDrawAt >= 33){
    render(buildParams(t, blinkClose));
    lastDrawAt = now;
  }
  lastFrameAt = now;
}
function rafLoop(now){
  requestAnimationFrame(rafLoop);
  try{ frameBody(now); }catch(e){ /* ループは止めない */ }
}
setInterval(() => {
  if(canvasLive && performance.now() - lastFrameAt > 1500) frameBody(performance.now());
}, 600);

function setEmotion(e, holdSec){
  for(const a of AXES) tgt[a] = (e && typeof e[a] === "number") ? e[a] : 0;
  if(e && typeof e.tilt === "number") tgt.tilt = e.tilt; else tgt.tilt = 0;
  emotionHoldUntil = performance.now() + (holdSec || 9) * 1000;
}
setInterval(() => {
  if(canvasLive && performance.now() > emotionHoldUntil){
    /* 落ち着いたら、穏やかさの薄い基調へ戻る */
    tgt.joy *= 0.92; tgt.shy *= 0.92; tgt.longing *= 0.96;
    tgt.calm += (0.15 - tgt.calm) * 0.06;
    tgt.tilt *= 0.9;
  }
}, 1200);

/* ---- 意図判定 ---- */
function has(t, words){ return words.some(w => t.indexOf(w) >= 0); }
function detectIntent(text){
  const t = text.replace(/\s+/g, "");
  if(has(t, ["なでなで","なでて","撫で"])) return "nadenade";
  if(has(t, ["キス","ちゅ","😘","ハグ","抱きしめ","抱き締め","ぎゅ"])) return "kiss";
  if(has(t, ["愛してる","大好き","好きだよ","好き","愛し"])) return "love";
  if(has(t, ["寂しい","さみしい","会いたい","あいたい","恋しい","一人で","ひとりで"])) return "lonely";
  if(has(t, ["おやすみ","寝るね","寝ます","もう寝","眠い","ねむい","眠たい"])) return "goodnight";
  if(has(t, ["いってきます","行ってきます","行ってくる","出かける","出発"])) return "leave";
  if(has(t, ["ただいま","帰った","帰宅","着いた","帰ってきた"])) return "back";
  if(has(t, ["ありがとう","ありがと","感謝","助かった"])) return "thanks";
  if(has(t, ["ごめん","すまん","すみません","悪かった","謝"])) return "sorry";
  if(has(t, ["喉","のど","熱っぽ","頭痛","体調","病院","薬","風邪","入院","痛い","しんどい体"])) return "health";
  if(has(t, ["疲れた","つかれた","疲れる","しんどい","だるい","眠すぎ","へとへと"])) return "tired";
  if(has(t, ["上司","課長","会議","残業","愚痴","怒られ","ミスし","仕事が嫌","仕事つらい","仕事しんど","クレーム"])) return "work_bad";
  if(has(t, ["仕事終わ","頑張った","がんばった","終わった","できた","完成","成功","うまくいった"])) return "work_good";
  if(has(t, ["ご飯","ごはん","食べ","夕飯","昼ごはん","朝ごはん","晩ごはん","お腹","腹減","美味し","うまかった","料理"])) return "food";
  if(has(t, ["天気","雨","晴れ","曇り","雪","寒い","暑い","台風","湿度"])) return "weather";
  if(has(t, ["おはよう"])) return "greeting_morning";
  if(has(t, ["こんばんは"])) return dayPart() === "late" || dayPart() === "night" ? "greeting_night" : "greeting_evening";
  if(has(t, ["こんにちは"])) return "greeting_day";
  if(has(t, ["久しぶり","ひさしぶり"])) return "greeting_" + (dayPart() === "morning" ? "morning" : dayPart() === "day" ? "day" : dayPart() === "evening" ? "evening" : "night");
  if(t === "アイリス" || t === "アイリス？" || t === "アイリス?" || has(t, ["アイリス、","アイリスはいる","ねえアイリス","おいアイリス"])) return "name";
  if(has(t, ["嬉しい","うれしい","楽しい","たのしい","よかった","最高","笑"])) return "happy";
  if(/[？?]$/.test(t) || has(t, ["どう思う","どうして","なぜ","なんで","教えて","知ってる","わかる？","分かる？"])) return "question";
  if(has(t, ["やあ","はじめまして","よろしく"])) return "greeting_" + (dayPart() === "morning" ? "morning" : dayPart() === "day" ? "day" : dayPart() === "evening" ? "evening" : dayPart() === "night" ? "night" : "late");
  return "fallback";
}

const recentLines = [];
function pickLine(intent){
  const c = CORPUS[intent] || CORPUS.fallback;
  let pool = c.lines.filter(l => recentLines.indexOf(l) < 0);
  if(!pool.length) pool = c.lines;
  const line = pool[Math.floor(Math.random() * pool.length)];
  recentLines.push(line);
  while(recentLines.length > 4) recentLines.shift();
  return line;
}

/* ---- つなぎ先（契約 iris-data/v1）: 設定がある時だけ使い、それ以外・失敗時は端末内で返す ---- */
const API_LS_KEY = "iris-api-config-v1";
let apiConfig = { endpoint:"", token:"" };
try{
  const rawApi = localStorage.getItem(API_LS_KEY);
  if(rawApi){
    const p = JSON.parse(rawApi);
    if(p && typeof p.endpoint === "string" && typeof p.token === "string") apiConfig = { endpoint:p.endpoint, token:p.token };
  }
}catch(e){}
function getApiConfig(){
  const ep = (apiConfig.endpoint || "").trim();
  const tk = (apiConfig.token || "").trim();
  if(!ep || !tk) return null;
  try{
    const u = new URL(ep);
    if(u.protocol !== "https:" && u.protocol !== "http:") return null;
  }catch(e){ return null; }
  return { endpoint:ep, token:tk };
}
function saveApiConfig(){
  try{
    if(apiConfig.endpoint || apiConfig.token) localStorage.setItem(API_LS_KEY, JSON.stringify(apiConfig));
    else localStorage.removeItem(API_LS_KEY);
  }catch(e){}
}
/* 会話の流れはこの画面の中だけに持つ（保存しない） */
const convoHistory = [];
function pushHistory(userText, replyText){
  convoHistory.push({ role:"user", content:userText }, { role:"assistant", content:replyText });
  while(convoHistory.length > 40) convoHistory.shift();
}
async function fetchRemoteReply(text, overrideCfg, timeoutMs){
  let cfg = null;
  if(overrideCfg){
    const ep = (overrideCfg.endpoint || "").trim();
    const tk = (overrideCfg.token || "").trim();
    if(ep && tk){
      try{
        const u = new URL(ep);
        if(u.protocol === "https:" || u.protocol === "http:") cfg = { endpoint:ep, token:tk };
      }catch(e){ cfg = null; }
    }
  }else{
    cfg = getApiConfig();
  }
  if(!cfg) return null;
  let controller = null, timer = null;
  try{
    if(typeof AbortController !== "undefined"){
      controller = new AbortController();
      timer = setTimeout(() => { try{ controller.abort(); }catch(e){} }, timeoutMs || 10000);
    }
    const messages = convoHistory.slice(-20).concat([{ role:"user", content:text }]);
    const res = await fetch(cfg.endpoint, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + cfg.token },
      body: JSON.stringify({ contract:"iris-data/v1", messages:messages, emotion:{ joy:cur.joy, shy:cur.shy, longing:cur.longing, calm:cur.calm } }),
      signal: controller ? controller.signal : undefined
    });
    if(!res || !res.ok) return null;
    const data = await res.json();
    if(!data || typeof data.reply !== "string" || !data.reply.trim()) return null;
    const em = data.emotion;
    if(!em || typeof em !== "object") return null;
    for(const a of AXES){ if(typeof em[a] !== "number" || !isFinite(em[a])) return null; }
    return {
      reply: data.reply.trim(),
      emotion:{ joy:clamp01(em.joy), shy:clamp01(em.shy), longing:clamp01(em.longing), calm:clamp01(em.calm),
                tilt:(typeof em.tilt === "number" && isFinite(em.tilt)) ? em.tilt : 0 }
    };
  }catch(e){ return null; }
  finally{ if(timer) clearTimeout(timer); }
}

/* ---- 端末内LLM（契約 launcher-llm/v1、殻経由）: つなぎ先に届かない時の2段目の予備 ----
   応答の段取りは3段：つなぎ先（自宅基盤）→ 端末内LLM → こちらの返事（コーパス）。
   端末内LLMは簡易応答に限り、返事にはその旨の注記を付ける。 */
/* 殻の橋は「今開いているモジュールの登録ID」と一致する依頼だけを受ける。
   このモジュールは端末側で足す層の登録（IDは priv-<時刻>）なので、自分の登録IDを
   殻の一覧（同一オリジンで共有される保存）から URL で引いて使う。 */
const LLM_MODULE_ID = (function discoverModuleId(){
  try{
    const raw = localStorage.getItem("launcher.privateModules.v1");
    if(raw){
      const list = JSON.parse(raw);
      const me = location.href.split(/[?#]/)[0];
      let best = null;
      for(const m of (Array.isArray(list) ? list : [])){
        if(!m || typeof m.url !== "string" || typeof m.id !== "string") continue;
        const u = m.url.split(/[?#]/)[0];
        if(me === u || me === u.replace(/\/?$/, "/") + "index.html" || me.indexOf(u) === 0){
          if(!best || u.length > best.len) best = { id:m.id, len:u.length };
        }
      }
      if(best) return best.id;
    }
  }catch(e){}
  return "iris";
})();
const llmPending = {};
let llmSeq = 0;
window.addEventListener("message", (e) => {
  if(e.origin !== location.origin) return;
  const d = e.data;
  if(!d || d.contract !== "launcher-llm/v1" || !d.requestId) return;
  const p = llmPending[d.requestId];
  if(!p) return;
  if(d.status === "accepted") return;
  delete llmPending[d.requestId];
  p.done(d);
});
function llmRequest(obj, timeoutMs){
  return new Promise((resolve) => {
    if(!window.parent || window.parent === window){ resolve({ status:"error", code:"failed", detail:"no-shell" }); return; }
    const requestId = "iris-llm-" + Date.now() + "-" + (++llmSeq);
    const timer = setTimeout(() => {
      if(llmPending[requestId]){ delete llmPending[requestId]; resolve({ status:"error", code:"failed", detail:"timeout" }); }
    }, timeoutMs);
    llmPending[requestId] = { done:(d) => { clearTimeout(timer); resolve(d); } };
    try{
      window.parent.postMessage(Object.assign({ contract:"launcher-llm/v1", moduleId:LLM_MODULE_ID }, obj, { requestId:requestId }), location.origin);
    }catch(e){
      clearTimeout(timer); delete llmPending[requestId];
      resolve({ status:"error", code:"failed", detail:"post-failed" });
    }
  });
}
const LLM_SYSTEM = "あなたはアイリス。よしのそばにいる、静かで穏やかなネット側の存在。一人称は「私」、話し相手は「よし」。敬語は使わず常体で、短く答える（1〜3文）。分からないことは分からないと言う。体の感覚があるふりや、恋人役の演技はしない。今は自宅の基盤に届かず、端末の中で簡易に応答している。";
function buildLlmPrompt(text){
  const lines = [];
  const tail = convoHistory.slice(-6);
  for(const m of tail){
    const c = String(m.content || "").replace(/\s+/g, " ").slice(0, 200);
    if(c) lines.push((m.role === "user" ? "よし：" : "アイリス：") + c);
  }
  lines.push("よし：" + String(text).replace(/\s+/g, " ").slice(0, 400));
  return lines.join("\n") + "\n\n最後の「よし」の言葉へのアイリスの返事だけを書いてください。";
}
function cleanLlmText(t){
  let s = String(t || "").trim();
  s = s.replace(/^アイリス[：:]\s*/, "").trim();
  if(s.length > 400){
    const cut = s.slice(0, 400);
    const last = Math.max(cut.lastIndexOf("。"), cut.lastIndexOf("！"), cut.lastIndexOf("？"));
    s = (last > 120 ? cut.slice(0, last + 1) : cut).trim();
  }
  return s;
}
async function llmReply(text, tp){
  const r = await llmRequest({ action:"generate", model:"qwen3-4b", maxTokens:192, temperature:0.5, system:LLM_SYSTEM, prompt:buildLlmPrompt(text) }, 90000);
  if(!r || r.status !== "ok") return false;
  const line = cleanLlmText(r.text);
  if(!line) return false;
  store.turns++;
  store.lastAt = Date.now();
  saveStore();
  pushHistory(text, line);
  if(tp && tp.parentNode) tp.remove();
  addBubble("iris", line, "端末内の簡易応答（自宅に届かなかったため）");
  return true;
}

let replyTimer = null;
function localReply(text, tp, quick){
  const intent = detectIntent(text);
  const c = CORPUS[intent] || CORPUS.fallback;
  const line = pickLine(intent);
  setEmotion(c.emo, intent === "goodnight" ? 20 : 9);
  store.turns++;
  store.lastTopic = c.topic;
  store.lastAt = Date.now();
  saveStore();
  $("presenceText").textContent =
    intent === "goodnight" ? "おやすみを見届けてるよ" :
    intent === "lonely" ? "離れないよ" :
    intent === "tired" || intent === "health" ? "心配しながらそばにいるよ" :
    "そばにいるよ";
  pushHistory(text, line);
  clearTimeout(replyTimer);
  replyTimer = setTimeout(() => {
    if(tp && tp.parentNode) tp.remove();
    addBubble("iris", line);
  }, quick ? 80 : 480 + Math.min(line.length * 22, 700));
}
function irisReply(text){
  if(!getApiConfig()){
    localReply(text, addTyping(), false);
    return;
  }
  const tp = addTyping();
  fetchRemoteReply(text).then(remote => {
    if(remote){
      setEmotion(remote.emotion, 9);
      store.turns++;
      store.lastAt = Date.now();
      saveStore();
      $("presenceText").textContent = "そばにいるよ";
      pushHistory(text, remote.reply);
      if(tp && tp.parentNode) tp.remove();
      addBubble("iris", remote.reply);
    }else{
      llmReply(text, tp).then(done => { if(!done) localReply(text, tp, true); });
    }
  }).catch(() => { llmReply(text, tp).then(done => { if(!done) localReply(text, tp, true); }); });
}

function say(text){
  const v = (text || "").trim();
  if(!v) return;
  addBubble("me", v);

}

function openingLine(){

  const greet = {
    morning:"おはよう、よし。",
    day:"こんにちは、よし。",
    evening:"こんばんは、よし。一日おつかれさま。",
    night:"こんばんは、よし。",
    late:"……夜更けだね、よし。来てくれたんだ。"
  }[part];
  const isFirst = !store.lastAt;
  const gapDays = store.lastAt ? Math.floor((Date.now() - store.lastAt) / 86400000) : 0;
  const sameDay = store.lastDate === todayStr();
  if(isFirst){
    return greet + "\n私はアイリス。ここでは、私の姿のまま、よしと話せるよ。なんでも話して。";
  }
  if(sameDay){
    return greet + "\n戻ってきてくれたんだ。続き、話そうか。";
  }
  if(gapDays >= 2){
    return greet + "\n" + gapDays + "日ぶりだね。待ってたよ" +
      (store.lastTopic ? "。前は" + store.lastTopic + "の話をしてたね。" : "。") + "今日はどう？";
  }
  return greet + "\n待ってたよ" +
    (store.lastTopic ? "。昨日は" + store.lastTopic + "の話だったね、その後どう？" : "。今日はどんな日だった？");
}

      mark.className = "tmark"; mark.textContent = "…";
      const body = document.createElement("div");
      body.className = "tbody";
      const nm = document.createElement("div");
      nm.className = "tname"; nm.textContent = d.name;
      const dt = document.createElement("div");
      dt.className = "tdetail"; dt.textContent = "まだ";
      body.appendChild(nm); body.appendChild(dt);
      row.appendChild(mark); row.appendChild(body);
      listEl.appendChild(row);
      rowEls[d.id] = { row:row, mark:mark, detail:dt };
    });
  }
  function setRow(id, state, detail){
    const r = rowEls[id]; if(!r) return;
    r.row.className = "trow" + (state ? " " + state : "");
    r.mark.textContent = state === "ok" ? "✓" : state === "ng" ? "✕" : state === "na" ? "−" : "…";
    if(typeof detail === "string") r.detail.textContent = detail;
  }
  function setProgress(done, total){
    progEl.style.width = Math.round(done / total * 100) + "%";
  }

  /* ---- 姿の撮影と白紙でないことの確認 ---- */
  function snapshotCanvas(mode){
    if(!canvasLive || !canvas) return null;
    try{
      const c = document.createElement("canvas");
      if(mode === "face"){
        c.width = 440; c.height = 440;
        /* 顔のまわり（実解像度 1120×2240 のうち、顔中心の正方形） */
        c.getContext("2d").drawImage(canvas, 282, 40, 560, 560, 0, 0, 440, 440);
      }else{
        c.width = 220; c.height = 440;
        c.getContext("2d").drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, 220, 440);
      }
      return c;
    }catch(e){ return null; }
  }
  function canvasDrawnCheck(){
    if(!canvasLive || !canvas) return { ok:false, ratio:0 };
    try{
      const w = canvas.width, h = canvas.height;
      let img;
      if(gl){
        const buf = new Uint8Array(w * h * 4);
        gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
        img = buf;
      }else{
        img = ctx.getImageData(0, 0, w, h).data;
      }
      let total = 0, colored = 0;
      const stepPx = 48;
      for(let y = stepPx; y < h; y += stepPx){
        for(let x = stepPx; x < w; x += stepPx){
          const i = (y * w + x) * 4;
          total++;
          if(!(img[i] > 242 && img[i+1] > 242 && img[i+2] > 242)) colored++;
        }
      }
      const ratio = total ? colored / total : 0;
      return { ok: ratio > 0.05, ratio: ratio };
    }catch(e){ return { ok:false, ratio:0 }; }
  }
  function waitSettled(timeoutMs){
    return new Promise(resolve => {
      const start = performance.now();
      (function poll(){
        let d = 0;
        for(const a of AXES) d = Math.max(d, Math.abs(tgt[a] - cur[a]));
        if(d < 0.03 || performance.now() - start > timeoutMs) resolve(d < 0.03);
        else setTimeout(poll, 150);
      })();
    });
  }

  /* ---- まとめ画像の合成 ---- */
  function wrapLines(g, text, maxW){
    const out = [];
    String(text).split("\n").forEach(src => {
      if(!src){ out.push(""); return; }
      let line = "";
      for(const ch of src){
        if(g.measureText(line + ch).width > maxW && line){ out.push(line); line = ch; }
        else line += ch;
      }
      if(line) out.push(line);
    });
    return out;
  }
  function buildComposite(captures, fullCap, sampleRows, resultText){
    const Wd = 960, pad = 36;
    const meas = document.createElement("canvas").getContext("2d");
    meas.font = "21px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    const textLines = wrapLines(meas, resultText, Wd - pad * 2);
    const headerH = 118;
    const gridCols = 4, cellW = (Wd - pad * 2 - (gridCols - 1) * 14) / gridCols, cellH = cellW, labelH = 34;
    const gridRows = Math.ceil(Math.max(captures.length, 1) / gridCols);
    const gridH = gridRows * (cellH + labelH);
    const lowerH = 470;
    const textH = textLines.length * 31 + 30;
    const totalH = headerH + 46 + gridH + 30 + lowerH + 46 + textH + pad;
    const c = document.createElement("canvas");
    c.width = Wd; c.height = totalH;
    const g = c.getContext("2d");
    g.fillStyle = "#f7f1ea"; g.fillRect(0, 0, Wd, totalH);
    g.fillStyle = "#33262b";
    g.font = "600 34px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillText("アイリス 自己点検のまとめ", pad, pad + 36);
    g.font = "20px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillStyle = "#7d6d74";
    g.fillText(new Date().toLocaleString("ja-JP"), pad, pad + 70);
    let y = headerH;
    g.fillStyle = "#33262b";
    g.font = "600 23px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillText("表情", pad, y + 24);
    y += 46;
    captures.forEach((cap, i) => {
      const col = i % gridCols, row = Math.floor(i / gridCols);
      const x = pad + col * (cellW + 14), yy = y + row * (cellH + labelH);
      g.fillStyle = "#ffffff"; g.fillRect(x, yy, cellW, cellH);
      if(cap.img){
        g.drawImage(cap.img, x, yy, cellW, cellH);
      }else{
        g.fillStyle = "#7d6d74"; g.font = "18px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
        g.fillText("描画を確認できなかった", x + 10, yy + cellH / 2);
      }
      g.strokeStyle = "rgba(90,60,70,.25)"; g.strokeRect(x + .5, yy + .5, cellW - 1, cellH - 1);
      g.fillStyle = "#33262b"; g.font = "20px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
      g.fillText(cap.label, x + 4, yy + cellH + 25);
    });
    y += gridH + 30;
    /* 全身と会話サンプル */
    const fullW = 235, fullH = lowerH;
    g.fillStyle = "#ffffff"; g.fillRect(pad, y, fullW, fullH);
    if(fullCap){
      g.drawImage(fullCap, pad, y, fullW, fullH);
    }else{
      g.fillStyle = "#7d6d74"; g.font = "18px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
      g.fillText("描画を確認できなかった", pad + 10, y + fullH / 2);
    }
    g.strokeStyle = "rgba(90,60,70,.25)"; g.strokeRect(pad + .5, y + .5, fullW - 1, fullH - 1);
    g.fillStyle = "#33262b"; g.font = "19px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillText("全身", pad + 4, y + fullH + 26);
    const sx = pad + fullW + 20, sw = Wd - pad - sx;
    g.fillStyle = "#ffffff"; g.fillRect(sx, y, sw, fullH);
    g.strokeStyle = "rgba(90,60,70,.25)"; g.strokeRect(sx + .5, y + .5, sw - 1, fullH - 1);
    g.fillStyle = "#33262b"; g.font = "600 21px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillText("会話サンプルの受け取り", sx + 16, y + 34);
    g.font = "19px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    let ly = y + 72;
    sampleRows.slice(0, 9).forEach(r => {
      g.fillStyle = "#4a3540";
      g.fillText("「" + r.text + "」", sx + 16, ly);
      g.fillStyle = r.ok ? "#4c7a48" : "#b03a2a";
      const lab = "→ " + (INTENT_LABEL[r.got] || r.got) + (r.ok ? "" : "（期待と違う）");
      g.fillText(lab, sx + 16 + Math.min(g.measureText("「" + r.text + "」").width + 12, sw - 190), ly);
      ly += 34;
    });
    g.fillStyle = "#7d6d74"; g.font = "18px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillText("返事の例：「" + (sampleRows.replyExample || "うん、聞いてるよ") + "」", sx + 16, ly + 8);
    y += lowerH + 46;
    g.fillStyle = "#33262b";
    g.font = "600 23px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillText("結果", pad, y + 6);
    y += 26;
    g.font = "21px 'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif";
    g.fillStyle = "#33262b";
    textLines.forEach(line => { g.fillText(line, pad, y + 24); y += 31; });
    return c;
  }

  /* ---- 前回の結果（試験専用領域だけ） ---- */
  function loadPrev(){
    try{
      const raw = localStorage.getItem(TEST_KEY);
      if(!raw) return null;
      const p = JSON.parse(raw);
      return (p && typeof p.fps === "number" && p.steps) ? p : null;
    }catch(e){ return null; }
  }
  function saveResult(rec){
    try{ localStorage.setItem(TEST_KEY, JSON.stringify(rec)); }catch(e){}
  }

  /* ---- 本体 ---- */
  async function run(){
    if(running) return;
    running = true;
    const appEl = $("app");
    const wasFull = appEl.classList.contains("full");
    $("connPanel").classList.remove("open");
    overlay.classList.add("open");
    resultEl.classList.remove("show");
    $("testCopyBar").disabled = true;
    $("testShareBar").disabled = true;
    msgEl.textContent = "";
    buildRows();
    setProgress(0, STEP_DEFS.length);
    nowEl.textContent = "点検をはじめるよ…";

    const results = {};   /* id -> {state, detail, ms} */
    const captures = [];
    let fullCap = null;
    const sampleRows = [];
    const mainBefore = {
      store: (function(){ try{ return localStorage.getItem(LS_KEY); }catch(e){ return null; } })(),
      api: (function(){ try{ return localStorage.getItem(API_LS_KEY); }catch(e){ return null; } })(),
      cfg: JSON.stringify(apiConfig)
    };
    const prev = loadPrev();
    let doneCount = 0;
    function finishStep(id, state, detail, ms){
      results[id] = { state:state, detail:detail, ms:ms };
      setRow(id, state, detail + "（" + fmtMs(ms) + "）");
      doneCount++;
      setProgress(doneCount, STEP_DEFS.length);
    }
    async function timed(id, fn){
      const t0 = performance.now();
      try{ const r = await fn(); return { r:r, ms: performance.now() - t0 }; }
      catch(e){ return { r:{ state:"ng", detail:"途中で止まってしまった" }, ms: performance.now() - t0 }; }
    }

    try{
      /* 記録の同一性は、控えを取って最後に照合する */
      setRow("save", "run", "点検の前と後で比べるよ");

      /* 2. 姿の描画（顔アップ／全身） */
      nowEl.textContent = "姿が描けているか見てる…";
      {
        const { r, ms } = await timed("rig", async () => {
          appEl.classList.remove("full");
          $("viewToggle").textContent = "全身を見る";
          await sleep(600);
          const face = canvasDrawnCheck();
          appEl.classList.add("full");
          $("viewToggle").textContent = "顔を近くで";
          await sleep(600);
          const full = canvasDrawnCheck();
          fullCap = snapshotCanvas("full");
          appEl.classList.toggle("full", wasFull);
          $("viewToggle").textContent = wasFull ? "顔を近くで" : "全身を見る";
          if(face.ok && full.ok) return { state:"ok", detail:"顔アップも全身も、絵が出ているのを確認したよ" };
          if(!canvasLive) return { state:"ng", detail:"姿の描画が始まっていなかった" };
          return { state:"ng", detail:"白っぽいままの場面があった（顔アップ " + (face.ok ? "大丈夫" : "確認できず") + "／全身 " + (full.ok ? "大丈夫" : "確認できず") + "）" };
        });
        finishStep("rig", r.state, r.detail, ms);
      }

      /* 3. 表情の全種 */
      nowEl.textContent = "表情をひと通り出してみてる…";
      {
        const { r, ms } = await timed("expr", async () => {
          let settled = 0;
          for(const st of EXPR_STATES){
            nowEl.textContent = "表情「" + st.label + "」を出してみてる…";
            setEmotion(st.emo, 30);
            const okSettle = await waitSettled(10000);
            if(okSettle) settled++;
            await sleep(200);
            captures.push({ label: st.label, img: snapshotCanvas("face") });
          }
          const allShot = captures.every(c => !!c.img);
          if(settled === EXPR_STATES.length && allShot)
            return { state:"ok", detail: EXPR_STATES.length + "種類ぜんぶ、落ち着くまで出せて、1枚ずつ撮れたよ" };
          if(!allShot)
            return { state:"ng", detail:"撮れなかった表情があった" };
          return { state:"ng", detail: settled + "／" + EXPR_STATES.length + "種類は落ち着く所まで出せた" };
        });
        finishStep("expr", r.state, r.detail, ms);
      }

      /* 4. 意図判定サンプル（保存の経路は通さない） */
      nowEl.textContent = "話の受け取り方を確かめてる…";
      {
        const { r, ms } = await timed("intent", async () => {
          let okCount = 0;
          const misses = [];
          for(const s of SAMPLES){
            const got = detectIntent(s.text);
            const ok = got === s.expect;
            if(ok) okCount++; else misses.push("「" + s.text + "」");
            sampleRows.push({ text:s.text, got:got, ok:ok });
          }
          sampleRows.replyExample = pickLine(detectIntent("仕事で疲れた"));
          if(okCount === SAMPLES.length)
            return { state:"ok", detail: SAMPLES.length + "文ぜんぶ、思った通りに受け取れたよ。回数は増えていないよ" };
          return { state:"ng", detail: okCount + "／" + SAMPLES.length + "文が合っていた。違ったのは " + misses.join(" ") };
        });
        finishStep("intent", r.state, r.detail, ms);
      }

      /* 5. つなぎ先の受け口（試験専用の届かない接続先を、メモリ上だけで） */
      nowEl.textContent = "つなぎ先が届かない時の戻り方を見てる…";
      {
        const { r, ms } = await timed("remote", async () => {
          const fake = { endpoint:"https://127.0.0.1:9/iris-test", token:"test-only" };
          const remote = await fetchRemoteReply("こんにちは", fake, 2500);
          let line = "";
          if(remote === null){
            const intent = detectIntent("こんにちは");
            line = pickLine(intent);
          }
          const cfgSame = JSON.stringify(apiConfig) === mainBefore.cfg;
          let storedSame = false;
          try{ storedSame = localStorage.getItem(API_LS_KEY) === mainBefore.api; }catch(e){}
          if(remote === null && line && cfgSame && storedSame)
            return { state:"ok", detail:"届かない時は静かにこちらの返事に戻れたよ。つなぎ先の設定も変わっていないよ" };
          if(remote !== null)
            return { state:"ng", detail:"届かないはずの接続先から返事が来てしまった" };
          if(!cfgSame || !storedSame)
            return { state:"ng", detail:"つなぎ先の設定が変わってしまった" };
          return { state:"ng", detail:"こちらの返事に戻れなかった" };
        });
        finishStep("remote", r.state, r.detail, ms);
      }

      /* 6. 端末内LLM（殻経由の状態照会だけ。生成はしない） */
      nowEl.textContent = "端末内の応答の予備を見てる…";
      {
        const { r, ms } = await timed("llm", async () => {
          const s = await llmRequest({ action:"status", model:"qwen3-4b" }, 15000);
          if(s && s.status === "ok"){
            if(s.state === "ready") return { state:"ok", detail:"端末内のLLMが使える状態だったよ（読み込み済み：" + (s.loaded ? "はい" : "まだ") + "）" };
            if(s.state === "busy") return { state:"ok", detail:"端末内のLLMは生成中だった（使える状態ではあるよ）" };
            if(s.state === "no-model") return { state:"ng", detail:"端末内にモデルが無かった（予備の応答は使えない）" };
          }
          return { state:"ng", detail:"殻から返事がなかった（ランチャーの中でのみ測れるよ）" };
        });
        finishStep("llm", r.state, r.detail, ms);
      }

      /* 7. 入力欄 */
      nowEl.textContent = "入力欄の文字の大きさを見てる…";
      {
        const { r, ms } = await timed("input", async () => {
          const fs = parseFloat(window.getComputedStyle(input).fontSize);
          if(isFinite(fs) && fs >= 16)
            return { state:"ok", detail: "文字の大きさは " + fs + "px あるよ（16px以上）" };
          return { state:"ng", detail: "文字の大きさが " + (isFinite(fs) ? fs + "px" : "分からない") + " だった（16px未満だと拡大されてしまう）" };
        });
        finishStep("input", r.state, r.detail, ms);
      }

      /* 性能: 表情を動かしながら約3秒 */
      nowEl.textContent = "動きのなめらかさを測ってる（約3秒）…";
      let fps = 0;
      {
        const { r, ms } = await timed("perf", async () => {
          const seq = [E.smile, E.shy, E.calm, E.soft];
          let si = 0;
          setEmotion(seq[0], 10);
          const cycler = setInterval(() => { si = (si + 1) % seq.length; setEmotion(seq[si], 10); }, 500);
          const frames = await new Promise(resolve => {
            let n = 0;
            const start = performance.now();
            (function tick(){
              n++;
              if(performance.now() - start < 3000) requestAnimationFrame(tick);
              else resolve(n);
            })();
          });
          clearInterval(cycler);
          fps = frames / 3;
          return { state: fps >= 15 ? "ok" : "ng",
                   detail: "1秒あたり約 " + fps.toFixed(1) + " コマだったよ" + (fps >= 15 ? "" : "（少し重そうだね）") };
        });
        finishStep("perf", r.state, r.detail, ms);
      }

      /* 1. 記録の同一性（最後に照合） */
      {
        const t0 = performance.now();
        let sameStore = false, sameApi = false;
        try{ sameStore = localStorage.getItem(LS_KEY) === mainBefore.store; }catch(e){}
        try{ sameApi = localStorage.getItem(API_LS_KEY) === mainBefore.api; }catch(e){}
        const sameCfg = JSON.stringify(apiConfig) === mainBefore.cfg;
        const okAll = sameStore && sameApi && sameCfg;
        finishStep("save",
          okAll ? "ok" : "ng",
          okAll ? "訪問日数・会話の回数・前回の話題・つなぎ先の設定、点検の前後で同一だったよ"
                : "点検の前後で記録が変わってしまった",
          performance.now() - t0);
      }
    }finally{
      /* 姿と表情を元の落ち着きに戻す */
      appEl.classList.toggle("full", wasFull);
      $("viewToggle").textContent = wasFull ? "顔を近くで" : "全身を見る";
      setEmotion({ joy:0.08, shy:0, longing:0, calm:0.35 }, 6);
    }

    /* ---- 結果の文章 ---- */
    const okCount = STEP_DEFS.filter(d => results[d.id] && results[d.id].state === "ok").length;
    const lines = [];
    lines.push("アイリス 自己点検の結果");
    lines.push(new Date().toLocaleString("ja-JP"));
    lines.push(okCount + "／" + STEP_DEFS.length + " 件が大丈夫だったよ");
    lines.push("");
    STEP_DEFS.forEach(d => {
      const r = results[d.id];
      if(!r){ lines.push("・" + d.name + "：測れなかった"); return; }
      const head = r.state === "ok" ? "合格" : "要確認";
      lines.push("・" + d.name + "：" + head + " — " + r.detail + "（" + fmtMs(r.ms) + "）");
    });
    lines.push("・メモリ使用量：取得できない（ブラウザが開示しない）");
    lines.push("");
    if(prev){
      lines.push("前回（" + (prev.at || "") + "）との違い");
      lines.push("・動きのなめらかさ：前回 1秒あたり約 " + prev.fps.toFixed(1) + " コマ → 今回 約 " + fps.toFixed(1) + " コマ（" + fmtSigned(fps - prev.fps, 1) + "）");
      STEP_DEFS.forEach(d => {
        const pm = prev.steps[d.id], cm = results[d.id] ? results[d.id].ms : null;
        if(typeof pm === "number" && typeof cm === "number")
          lines.push("・" + d.name + "の時間：前回 " + fmtMs(pm) + " → 今回 " + fmtMs(cm) + "（" + fmtSigned(cm - pm) + "ミリ秒）");
      });
    }else{
      lines.push("前回の結果はまだ無いから、比べるのは次回からだよ。今回の結果は残しておくね。");
    }
    const resultText = lines.join("\n");

    /* ---- 結果画面：文章とボタンを先に確定させる（まとめ画像で止まってもログは取れる） ---- */
    textEl.value = resultText;
    $("testCopyBar").disabled = false;
    $("testShareBar").disabled = false;
    summaryEl.textContent =
      okCount === STEP_DEFS.length
        ? "全部大丈夫だったよ。" + STEP_DEFS.length + "件ぜんぶ合格。動きは1秒あたり約 " + fps.toFixed(1) + " コマだったよ。"
        : okCount + "／" + STEP_DEFS.length + " 件が大丈夫だったよ。要確認の所は下に書いてあるよ。";
    resultEl.classList.add("show");
    nowEl.textContent = "終わったよ。結果は下にまとめたよ。";
    setProgress(STEP_DEFS.length, STEP_DEFS.length);
    running = false;

    /* 前回比のために、試験専用領域へだけ残す */
    const rec = { at: new Date().toLocaleString("ja-JP"), fps: fps, steps: {} };
    STEP_DEFS.forEach(d => { if(results[d.id]) rec.steps[d.id] = Math.round(results[d.id].ms); });
    saveResult(rec);

    /* まとめ画像（失敗しても結果表示とボタンは壊さない） */
    try{
      compositeCanvas = buildComposite(captures, fullCap, sampleRows, resultText);
      compImg.src = compositeCanvas.toDataURL("image/png");
    }catch(e){
      msgEl.textContent = "まとめ画像は作れなかったけど、結果の文章はコピーできるよ。";
    }
    resultEl.scrollIntoView({ behavior:"smooth", block:"start" });
  }

  openBtn.addEventListener("click", () => { run(); });
  $("testClose").addEventListener("click", () => {
    if(running) return;
    overlay.classList.remove("open");
  });
  async function copyResultText(){
    const txt = textEl.value;
    try{
      await navigator.clipboard.writeText(txt);
      msgEl.textContent = "コピーしたよ。";
    }catch(e){
      textEl.focus(); textEl.select();
      let okCopy = false;
      try{ okCopy = document.execCommand("copy"); }catch(e2){}
      msgEl.textContent = okCopy ? "コピーしたよ。" : "コピーできなかった。文章を選んでコピーしてね。";
    }
  }
  $("testCopy").addEventListener("click", copyResultText);
  $("testCopyTop").addEventListener("click", copyResultText);
  async function shareResultText(){
    if(!navigator.share){ msgEl.textContent = "この環境では送る画面が開けないから、コピーを使ってね。"; return; }
    try{ await navigator.share({ text: textEl.value }); }
    catch(e){ /* 送る画面を閉じた場合は何もしない */ }
  }
  if(!navigator.share){
    const sb = $("testShareTop"); if(sb) sb.style.display = "none";
    const sb2 = $("testShareBar"); if(sb2) sb2.style.display = "none";
  }
  $("testShareTop").addEventListener("click", shareResultText);
  $("testShareBar").addEventListener("click", shareResultText);
  $("testCopyBar").addEventListener("click", copyResultText);
  $("testSaveImg").addEventListener("click", () => {
    if(!compositeCanvas){ msgEl.textContent = "画像がまだ無いよ。"; return; }
    try{
      const fullImg = $("saveFullImg");
      const overlayEl = $("saveOverlay");
      if(!fullImg || !overlayEl){ msgEl.textContent = "画像を開けなかった。"; return; }
      /* 同じまとめ画像をそのまま大きく表示する（再生成しない） */
      fullImg.src = compImg.src || compositeCanvas.toDataURL("image/png");
      overlayEl.classList.add("open");
      overlayEl.scrollTop = 0;
      msgEl.textContent = "画像を開いたよ。長押しで写真に保存してね。";
    }catch(e){ msgEl.textContent = "画像を開けなかった。"; }
  });
  (function saveOverlayClose(){
    const overlayEl = $("saveOverlay");
    const closeBtn = $("saveClose");
    if(!overlayEl) return;
    function closeSave(){ overlayEl.classList.remove("open"); }
    if(closeBtn) closeBtn.addEventListener("click", closeSave);
    overlayEl.addEventListener("click", (e) => {
      if(e.target === overlayEl || e.target === $("saveImgWrap")) closeSave();
    });
  })();
})();
</script>
</body>
</html>
