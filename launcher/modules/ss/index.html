<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>のくす書庫</title>
<style>
:root{
  --label:#1c1c1e; --label2:rgba(60,60,67,.66); --label3:rgba(60,60,67,.42);
  --tint:#007AFF; --red:#FF3B30; --orange:#FF9500; --green:#34C759;
  --glass:rgba(255,255,255,.52); --glass-edge:rgba(255,255,255,.65);
  --sep:rgba(60,60,67,.14); --card:#FFFFFF; --fill:rgba(120,120,128,.14);
  --shadow:0 10px 34px rgba(31,38,135,.14),0 2px 8px rgba(31,38,135,.08);
  --spec:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -0.5px 0 rgba(255,255,255,.25);
  --radius:24px; --motion-spatial-fast:.18s cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){
  :root{ --label:#fff; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.38);
    --tint:#0A84FF; --red:#FF453A; --orange:#FF9F0A; --green:#30D158;
    --glass:rgba(38,38,44,.46); --glass-edge:rgba(255,255,255,.22);
    --sep:rgba(255,255,255,.14); --card:#1E1E24; --fill:rgba(120,120,128,.26);
    --shadow:0 12px 36px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.35);
    --spec:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -0.5px 0 rgba(255,255,255,.06); }
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ touch-action:manipulation; }
body{ margin:0; color:var(--label); background:#EDF1F8;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans CJK JP",sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding-bottom:calc(40px + env(safe-area-inset-bottom)); }
@media (prefers-color-scheme: dark){ body{ background:#05060A; } }
.aurora{ position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
.aurora i{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; }
.aurora .a1{ width:340px;height:340px;background:#8EC5FF;top:-110px;left:-90px; }
.aurora .a2{ width:300px;height:300px;background:#D8B4FE;top:16%;right:-120px;opacity:.45; }
.aurora .a3{ width:280px;height:280px;background:#A7F3EA;bottom:6%;left:-100px;opacity:.4; }
@media (prefers-color-scheme: dark){ .aurora i{ opacity:.28; } }
.glass{ background:var(--glass); border:1px solid var(--glass-edge);
  -webkit-backdrop-filter:blur(22px) saturate(180%); backdrop-filter:blur(22px) saturate(180%);
  box-shadow:var(--shadow),var(--spec); }
header{ padding:14px 22px 0; max-width:720px; margin:0 auto; }
h1{ font-size:28px; font-weight:800; letter-spacing:-.022em; margin:0; }
.meta{ color:var(--label2); font-size:13px; margin-top:3px; }
main{ padding:4px 16px 8px; max-width:720px; margin:0 auto; }
.card{ background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-top:12px; }
.title{ font-size:17px; font-weight:700; }
.small{ font-size:13px; color:var(--label2); }
.badge{ display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap; }
.badge.warn{ background:rgba(255,149,0,.18); color:#9a5b00; }
.badge.info{ background:rgba(0,122,255,.14); color:#0a5cd6; }
.badge.idle{ background:var(--fill); color:var(--label2); }
@media (prefers-color-scheme: dark){ .badge.warn{ color:#ffb340; } .badge.info{ color:#4da3ff; } }
.mini{ border:none; cursor:pointer; border-radius:999px; padding:9px 14px; background:var(--tint); color:#fff; font-size:13.5px; font-weight:700; }
.mini.ghost{ background:var(--card); color:var(--tint); border:1.5px solid var(--tint); }
.mini.gray{ background:var(--fill); color:var(--label); }
input[type=search]{ width:100%; padding:13px 16px; border-radius:999px; border:1.5px solid var(--sep);
  background:var(--card); color:var(--label); font-size:16px; margin-top:12px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
.chip{ padding:6px 12px; border-radius:999px; font-size:13px; font-weight:600; border:1.5px solid var(--sep);
  color:var(--label2); background:var(--card); cursor:pointer; }
.chip.on{ background:var(--tint); border-color:var(--tint); color:#fff; }
.story{ display:block; width:100%; text-align:left; border:none; cursor:pointer; background:var(--card);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:11px 44px 11px 14px; margin-top:8px; color:var(--label);
  content-visibility:auto; contain-intrinsic-size:auto 78px; }
.story .t{ font-size:15.5px; font-weight:700; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.story .row{ display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; align-items:center; }
.storyWrap{ position:relative; }
.favStar{ position:absolute; top:8px; right:8px; z-index:2; border:none; cursor:pointer; width:34px; height:34px;
  border-radius:999px; background:var(--fill); color:var(--label3); font-size:16px; line-height:1; }
.favStar.on{ background:var(--orange); color:#fff; }
.chips.rail{ flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; scrollbar-width:none; }
.chips.rail::-webkit-scrollbar{ display:none; }
.chips.rail .chip{ flex:0 0 auto; }
.toolbar{ position:sticky; top:6px; z-index:25; background:var(--card);
  border-radius:18px; box-shadow:var(--shadow); padding:10px 12px; margin-top:10px; }
.toolbar input[type=search]{ margin-top:0; }
.toolbar .chips{ margin-top:8px; }
.toolbar .controls{ margin-top:8px; }
.moreBtn{ display:flex; align-items:center; justify-content:center; width:100%; border:none; cursor:pointer;
  border-radius:999px; padding:12px; margin-top:12px; background:var(--fill); color:var(--label); font-size:14.5px; font-weight:700; }
.railWrap{ margin-top:14px; }
.railTitle{ font-size:13px; font-weight:700; color:var(--label2); margin:0 2px 6px; }
.hRail{ display:flex; gap:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:2px; scrollbar-width:none; }
.hRail::-webkit-scrollbar{ display:none; }
.hCard{ flex:0 0 168px; text-align:left; border:none; cursor:pointer; background:var(--card); border-radius:16px;
  box-shadow:var(--shadow); padding:10px 12px; color:var(--label); }
.hCard .t{ font-size:14px; font-weight:700; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:40px; }
.hCard .pbar{ margin-top:6px; }
.countLine{ text-align:center; font-size:12.5px; color:var(--label3); margin-top:10px; }
.pbar{ height:5px; border-radius:3px; background:var(--fill); margin-top:6px; overflow:hidden; }
.pbar i{ display:block; height:100%; background:var(--tint); border-radius:3px; }
.bar{ position:sticky; top:8px; z-index:20; border-radius:26px;
  padding:8px 10px; display:flex; gap:6px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.bar .grp{ display:flex; gap:6px; align-items:center; }
.bar button{ border:none; cursor:pointer; border-radius:999px; padding:8px 13px; font-size:13.5px; font-weight:700;
  background:var(--fill); color:var(--label); white-space:nowrap; }
.bar button.on{ background:var(--tint); color:#fff; }
.part{ margin-top:26px; }
.part .ph{ font-size:13px; font-weight:700; color:var(--label2); border-bottom:1px solid var(--sep); padding-bottom:6px; margin-bottom:12px; }
.gap{ margin-top:26px; border:1.5px dashed var(--sep); border-radius:16px; padding:18px; text-align:center; color:var(--label2); font-size:14px; }
.text{ white-space:pre-wrap; word-break:break-word; line-height:1.9; }
.aa{ font-family:'SSAA','SSNoto','MS PGothic','ＭＳ Ｐゴシック',IPAMonaPGothic,monospace; white-space:pre;
  line-height:1.0; font-size:11px; word-break:normal; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
.aaBox{ background:var(--fill); border-radius:12px; margin:10px 0; padding:10px 6px; overflow-x:auto;
  -webkit-overflow-scrolling:touch; position:relative; }
.aaHint{ position:absolute; top:6px; right:8px; font-size:10.5px; color:var(--label3); background:var(--card);
  border:1px solid var(--sep); border-radius:999px; padding:2px 8px; pointer-events:none; }
#aaFull{ position:fixed; inset:0; z-index:80; background:#0a0d14; display:flex; flex-direction:column; }
#aaFull[hidden]{ display:none; }
#aaFullBar{ display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px; color:#f2ead8; font-size:13px; }
#aaFullClose{ font-size:13.5px; font-weight:700; color:#101623; background:#ffd873; border:none;
  border-radius:999px; padding:8px 14px; cursor:pointer; }
#aaFullScroll{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:6px 10px calc(14px + env(safe-area-inset-bottom)); }
#aaFullText{ color:#f5eeda; font-size:13px; }
.aaCanvas{ display:block; }
.text .ph2{ color:var(--label2); font-size:.82em; }
.vwrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.vtext{ writing-mode:vertical-rl; height:62vh; line-height:2.0; white-space:pre-wrap; word-break:break-word; padding:6px 4px; }
.aaImgBox{ background:#14161d; }
.aaImg{ display:block; }
.note{ font-size:12.5px; color:var(--label3); margin-top:10px; }
.act{ display:flex; align-items:center; justify-content:center; width:100%; border:none; cursor:pointer;
  border-radius:999px; padding:14px; margin-top:14px; background:var(--tint); color:#fff; font-size:15.5px; font-weight:700; }
.tabbar{ display:flex; gap:6px; max-width:720px; margin:12px auto 0; padding:0 16px; }
.tabbar .tab{ flex:1; border:1.5px solid var(--sep); background:var(--card); color:var(--label2);
  border-radius:999px; padding:10px; font-size:14.5px; font-weight:700; cursor:pointer; }
.tabbar .tab.on{ background:var(--tint); border-color:var(--tint); color:#fff; }
.tagSheet{ position:fixed; inset:0; z-index:60; display:none; background:rgba(20,24,40,.38); }
.tagSheet.open{ display:flex; flex-direction:column; justify-content:flex-end; }
.tagPanel{ background:var(--card); border-radius:28px 28px 0 0; max-height:86vh; display:flex; flex-direction:column;
  padding:16px 16px calc(14px + env(safe-area-inset-bottom)); box-shadow:var(--shadow); }
.tagPanelHead{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.tagPanel input[type=search]{ margin-top:12px; }
.tagList{ overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-wrap:wrap; gap:6px;
  padding:10px 0 8px; align-content:flex-start; overscroll-behavior:contain; }
.tagList .chip{ flex:0 0 auto; }
.controls{ display:flex; gap:8px; align-items:center; margin-top:10px; flex-wrap:wrap; }
.controls select{ flex:1 1 160px; padding:11px 14px; border-radius:999px; border:1.5px solid var(--sep);
  background:var(--card); color:var(--label); font-size:14.5px; font-weight:600; }
.favBtn.on{ background:var(--orange); color:#fff; }
.rowBtns{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.partList{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 0; overscroll-behavior:contain; }
.partList button{ display:block; width:100%; text-align:left; border:none; background:transparent; cursor:pointer;
  padding:11px 6px; font-size:15px; font-weight:600; color:var(--label); border-bottom:1px solid var(--sep); }
.partList button.gapItem{ color:var(--label2); font-weight:500; }
</style>
</head>
<body>
<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>
<div id="shelfView">
  <header><h1>のくす書庫</h1><div class="meta" id="freshMeta">読み込み中…</div></header>
  <div class="tabbar"><button class="tab on" id="tabShelf">本棚</button><button class="tab" id="tabSaved">保存済み</button></div>
  <main>
    <div class="toolbar">
      <input type="search" id="q" placeholder="題名・タグで探す">
      <div class="chips rail" id="stateChips"></div>
      <div class="controls">
        <select id="sortSel" aria-label="並び替え">
          <option value="recommend">並び：おすすめ（読みかけ先頭）</option>
          <option value="title">並び：タイトル順</option>
          <option value="chars_desc">並び：文字数が多い順</option>
          <option value="parts_desc">並び：編数が多い順</option>
          <option value="recent">並び：最近開いた順</option>
        </select>
        <button class="mini gray" id="randomBtn">未読からランダム</button>
      </div>
      <div class="chips rail" id="tagChips"></div>
    </div>
    <div id="homeRails"></div>
    <div id="shelf"></div>
    <div id="moreArea"></div>
    <div id="savedView" style="display:none">
      <div class="card">
        <div class="title" style="font-size:15px">保存済みの話</div>
        <div class="small" id="savedMeta" style="margin-top:6px">読み込み中…</div>
        <div class="note">ここにある話はネットが無くても読める。AA画像が未保存の話は、開いて「保存」を押すと揃う。</div>
      </div>
      <div id="savedList"></div>
    </div>
    <div class="card" id="offlineCard">
      <div class="title" style="font-size:15px">オフライン保存</div>
      <div class="small" id="offlineStatus" style="margin-top:6px">状態を確認中…</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button class="mini" id="offlineSaveBtn">全件保存する</button>
        <button class="mini gray" id="offlineDelBtn">保存を消す</button>
      </div>
      <div class="small" id="offlineProg" style="margin-top:8px"></div>
      <div class="note" style="margin-top:6px">ネットが無い時でも本棚と本文が読めるように、索引・本文・AA画像をこの端末の中に保存する。保存には通信と端末の空き容量が要る（索引・本文・AA画像で約61MB）。読んだ作品は自動で保存される。</div>
    </div>
    <div class="note" id="buildNote"></div>
  </main>
</div>

<div id="readerView" style="display:none">
  <main>
    <div class="bar glass">
      <div class="grp"><button id="backBtn">本棚へ</button><button id="bmBtn">しおり</button><button id="bmGoBtn" style="display:none">しおりへ</button><button id="partsBtn">編一覧</button><button id="saveBtn">保存する</button></div>
      <div class="grp"><button id="dirBtn">縦書き</button><button id="fsMinus">A−</button><button id="fsPlus">A＋</button><button id="lhMinus">行間−</button><button id="lhPlus">行間＋</button></div>
    </div>
    <h1 id="rTitle" style="font-size:23px;margin-top:16px"></h1>
    <div class="meta" id="rMeta"></div>
    <div id="rBody"></div>
    <button class="act" id="nextPartBtn" style="display:none">次の編へ</button>
    <div id="related"></div>
    <div class="note">読み位置は自動で保存される（自動しおり）。「しおり」は今の編に手動の印を付ける。</div>
  </main>
</div>

<div id="tagSheet" class="tagSheet" aria-hidden="true">
  <div class="tagPanel">
    <div class="tagPanelHead"><span class="title">タグで探す</span><button class="mini gray" id="tagSheetClose">閉じる</button></div>
    <input type="search" id="tagQ" placeholder="タグ名で絞る">
    <div class="small" id="tagSheetMeta" style="margin-top:8px"></div>
    <div class="tagList" id="tagList"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="mini" id="tagApplyBtn">この条件で見る</button>
      <button class="mini gray" id="tagClearBtn">絞り込みを外す</button>
    </div>
    <div class="small" style="margin-top:6px">タグは複数選べる（すべて含む作品だけ出す）。</div>
  </div>
</div>

<div id="partSheet" class="tagSheet" aria-hidden="true">
  <div class="tagPanel">
    <div class="tagPanelHead"><span class="title">編一覧</span><button class="mini gray" id="partSheetClose">閉じる</button></div>
    <div class="partList" id="partList"></div>
  </div>
</div>

<div id="aaFull" hidden>
  <div id="aaFullBar"><span>AA を大きく見る（横スクロールできます）</span><button id="aaFullClose" type="button">✕ 閉じる</button></div>
  <div id="aaFullScroll"><div id="aaFullText" class="aa"></div></div>
</div>
<script>
'use strict';
var SS_BUILD = '2026-11-21-ss22';
/* 版の自己確認：公開側の build.txt が新しければ、版パラメータを付けて自分を読み直す（WebViewキャッシュ対策） */
function checkBuild(){
  fetch('build.txt?ts=' + Date.now(), { cache:'no-store' }).then(function(r){ return r.text(); }).then(function(t){
    var m = t.match(/build:\s*(\S+)/);
    if(!m) return;
    var remote = m[1];
    if(remote === SS_BUILD) return;
    if(location.search.indexOf('v=' + encodeURIComponent(remote)) >= 0) return; /* 読み直し済み。それでも旧い場合は Pages 側の反映待ち */
    location.replace(location.pathname + '?v=' + encodeURIComponent(remote) + location.hash);
  }).catch(function(){});
}
checkBuild();
setTimeout(checkBuild, 4000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) checkBuild(); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
var AA_FONT_STATE = '読込中';
$('aaFullClose').addEventListener('click', closeAAFull);
function updateBuildNotes(){
  document.getElementById('buildNote').textContent = 'モジュール build ' + SS_BUILD + '／AAフォント：' + AA_FONT_STATE + '／データ契約 ss-data/v1（本部が生成・差し替え）';
  if(cur) renderMeta();
}
function probeAAFont(){
  try{
    var c = document.createElement('canvas').getContext('2d');
    c.font = '20px SSAA';
    return Math.abs(c.measureText('＿'.repeat(10)).width - 200) < 3 && Math.abs(c.measureText('A'.repeat(20)).width - 200) < 3; /* SSAAなら全角10字＝半角20字＝200px */
  }catch(e){ return false; }
}
function loadAAFont(){
  if(!('FontFace' in window)){ AA_FONT_STATE = '未対応（端末フォントで表示）'; updateBuildNotes(); return; }
  var ffSub = new FontFace('SSNoto', "url('fonts/aa.woff2?v=" + SS_BUILD + "')");
  document.fonts.add(ffSub);
  ffSub.load().then(function(){ fitAllAA(); }, function(){});
  var ff = new FontFace('SSAA', "url('fonts/aa-mona.woff2?v=" + SS_BUILD + "')");
  document.fonts.add(ff);
  ff.load().then(function(){
    AA_FONT_STATE = probeAAFont() ? '適用済み' : '未適用（読めたが字幅が合わない）';
    updateBuildNotes(); fitAllAA();
    if(AA_FONT_STATE === '適用済み') upgradeAABlocks();
  }, function(){
    AA_FONT_STATE = '読込失敗（端末フォントで表示）';
    updateBuildNotes();
  });
}
loadAAFont();

var INDEX = null;
var settings = loadObj('ss.settings.v1') || {};
if(settings.vertical == null) settings.vertical = false;
if(!settings.fontSize) settings.fontSize = 17;
if(!settings.lineHeight) settings.lineHeight = 1.9;
if(!settings.sort) settings.sort = 'recommend';
var progress = loadObj('ss.progress.v1') || {};
var favs = loadObj('ss.favs.v1') || {};
function loadObj(k){ try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; } }
function saveObj(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============ 編の順序と欠け ============ */
function partBase(p){ var m = String(p).match(/^(\d+)/); return m ? parseInt(m[1], 10) : 0; }
function partSuffix(p){ var m = String(p).match(/^\d+(.*)$/); return m ? m[1] : ''; }
function sortParts(parts){
  return parts.slice().sort(function(a, b){
    var d = partBase(a.part) - partBase(b.part);
    if(d) return d;
    return partSuffix(a.part) < partSuffix(b.part) ? -1 : 1;
  });
}
/* 既存の編と欠けを、流れを切らない1列に並べる */
function buildSequence(story, parts){
  var sorted = sortParts(parts);
  var byBase = {};
  sorted.forEach(function(p){ var b = partBase(p.part); (byBase[b] = byBase[b] || []).push(p); });
  var gaps = (story.gaps || []).slice();
  var maxN = Math.max.apply(null, sorted.map(function(p){ return partBase(p.part); }).concat([0]));
  gaps.forEach(function(g){ if(g > maxN) maxN = g; });
  var seq = [];
  for(var n = 0; n <= maxN; n++){
    if(byBase[n]) byBase[n].forEach(function(p){ seq.push({ type:'part', part:p.part, text:p.text, n:n, idx:p._idx }); });
    else if(gaps.indexOf(n) >= 0) seq.push({ type:'gap', n:n });
  }
  return seq;
}

/* ============ 本棚 ============ */
var curTags = [];
var stateFilter = ''; /* '' | reading | done | unread | gaps | fav */
var TAG_TOP = 12;
var STATES = [ ['', 'すべて'], ['reading', '読みかけ'], ['done', '読了'], ['unread', '未読'], ['gaps', '欠けのみ'], ['fav', 'お気に入り'] ];
function storyPct(s){ var p = progress[s.id]; return p ? Math.round(p.pct || 0) : 0; }
function storyMark(s){
  if(s.mark === 'new' || s.is_new) return '新着';
  if(s.mark === 'updated' || s.is_updated) return '更新';
  return '';
}
function renderStates(){

/* AA（アスキーアート）判定：記号と空白が大半を占める行が3行以上続いたらAAブロックとして切り出す。
   AAは等幅フォント＋折り返しなしでないと崩れるため、通常本文とは別に描く */
function isAALine(line){
  if(!line || !line.trim()) return false;
  if(line.length < 6) return false;
  if(/^\s*>>\d+/.test(line)) return false; /* アンカー（>>14）の並びはAAではない */

  var letters = line.length - glyphs - spaces;
  if(letters === 0 && spaces >= 4 && glyphs >= 1) return true; /* 全角空白で組まれたAAの疎な行 */
  if(glyphs >= 3 && (glyphs + spaces) / line.length >= 0.5 && letters <= glyphs) return true;
  /* AAの疎な行：大きく字下げされ、文らしい仮名・漢字の連なりがない（線を引く記号が要る） */
  var drawGlyphs = glyphs - (line.match(/>/g) || []).length;

  return false;
}
/* 文の行（AAの境界）：行の「始まり方」で見る。AAの右端に文がくっついた行はAA側に残すため、

function isProseLine(line){

  if(/^\d{4}\/\d{2}\/\d{2}/.test(t)) return true;
  if(/[ぁ-んァ-ヶ一-龥]{4,}/.test(t.slice(0, 12))) return true;
  if(t.indexOf('「') >= 0 && t.indexOf('「') <= 6) return true; /* 名前「…」型のセリフ行 */

function segmentize(text){

}

      pos = e.line + e.count;

/* AAは Mona 系の等幅フォントで固定 11px のまま流し、空白を保持して折り返さない。
   画面幅を超えるブロックは縮小せず、箱の横スクロールで見る（ss17 の方針転換：

/* AAの本表示は canvas（ss18）：1字ずつ実測の字幅で格子位置に描き、行ピッチは厳密に 1.0。
   ブラウザの行レイアウト（行箱・ベースライン・端数丸め）に依存しないための方式。
   フォント未着の間は DOM テキスト（行間 1.0）で出し、着いたら格上げする */
function buildAACanvas(text, F, color){

  var rows = lines.map(function(line){
    var cells = [], x = 0;
    Array.from(line).forEach(function(ch){
      var w = mctx.measureText(ch).width / 100 * F;
      cells.push({ ch: ch, x: x }); x += w;
    });

  cv.className = 'aaCanvas';
  cv.width = Math.max(1, Math.ceil(W * dpr));
  cv.height = Math.max(1, Math.ceil(lines.length * F * dpr));
  cv.style.width = W + 'px';
  cv.style.height = (lines.length * F) + 'px';
  var ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.font = F + 'px SSAA, SSNoto, monospace';
  ctx.textBaseline = 'top';
  ctx.fillStyle = color;
  rows.forEach(function(r, ri){
    r.cells.forEach(function(c){
      if(c.ch !== ' ' && c.ch !== '　') ctx.fillText(c.ch, c.x, ri * F);
    });

}

/* ============ オフライン保存（ss21） ============
   sw.js の DATA_CACHE と cache 名を揃える。ページ側でも保持と読み戻しを持ち、
   Service Worker が使えない環境でも「ページが開けた時」は保存分で読める形にする */
var SS_DATA_CACHE = 'ss-data-v1'; /* ss22〜：データの保持はアプリの版から切り離す。世代交代は索引の generated_at で管理 */
var ssSwState = ('serviceWorker' in navigator) ? '登録中' : '使えない環境';
function ssKey(path){
  var u = new URL(path, location.href);
  u.searchParams.delete('ts'); u.searchParams.delete('v'); u.searchParams.delete('sv');
  u.hash = '';
  return u.href;
}
function ssOpenCache(){
  if(!('caches' in window)) return Promise.reject(new Error('no-cache-api'));
  return caches.open(SS_DATA_CACHE);
}
function fetchJson(path){
  return fetch(path + '?ts=' + Date.now(), { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    var cl = r.clone();
    ssOpenCache().then(function(c){ return c.put(ssKey(path), cl); }).catch(function(){});
    return r.json();
  }).catch(function(err){
    return ssOpenCache().then(function(c){ return c.match(ssKey(path)); }).then(function(hit){
      if(hit) return hit.json();
      throw err;
    });
  });
}
function ssProg(t){ var el = $('offlineProg'); if(el) el.textContent = t; }
function ssCounts(){
  return ssOpenCache().then(function(c){ return c.keys(); }).then(function(keys){
    var texts = 0, aas = 0, idx = false;
    keys.forEach(function(k){
      if(/\/data\/texts\//.test(k.url)) texts++;
      else if(/\/data\/aa\//.test(k.url)) aas++;
      else if(/\/data\/index\.json$/.test(k.url)) idx = true;
    });
    return { texts:texts, aas:aas, idx:idx };
  }).catch(function(){ return null; });
}
function ssRenderStatus(msg){
  var el = $('offlineStatus');
  if(!el) return;
  ssCounts().then(function(cnt){
    if(!cnt){ el.textContent = 'この環境では保存の仕組み（Cache Storage）が使えない。'; return; }
    var tTotal = INDEX ? INDEX.stories.length : 0;
    var line = '保存済み：索引 ' + (cnt.idx ? 'あり' : 'なし') +
      '・本文 ' + cnt.texts + (tTotal ? ' / ' + tTotal : '') + ' 件' +
      '・AA画像 ' + cnt.aas + ' 枚' +
      '／オフライン対応（ページごと）：' + ssSwState;
    if(navigator.storage && navigator.storage.estimate){
      navigator.storage.estimate().then(function(est){
        if(est && est.usage) line += '／端末内の使用量 約 ' + Math.round(est.usage / 1048576) + ' MB';
        el.textContent = (msg ? msg + '　' : '') + line;
      }).catch(function(){ el.textContent = (msg ? msg + '　' : '') + line; });
    } else {
      el.textContent = (msg ? msg + '　' : '') + line;
    }
  });
}
function ssEnsureText(id){
  var path = 'data/texts/' + encodeURIComponent(id) + '.json';
  return ssOpenCache().then(function(c){ return c.match(ssKey(path)); }).then(function(hit){
    if(hit) return hit.json().catch(function(){ return null; });
    return fetchJson(path).catch(function(){ return null; });
  }).catch(function(){ return null; });
}
function ssEnsureBin(path){
  return ssOpenCache().then(function(c){
    return c.match(ssKey(path)).then(function(hit){
      if(hit) return true;
      return fetch(path, { cache:'no-store' }).then(function(r){
        if(!r.ok) return false;
        return c.put(ssKey(path), r).then(function(){ return true; }).catch(function(){ return false; });
      }).catch(function(){ return false; });
    });
  }).catch(function(){ return false; });
}
var ssSaving = false;
function ssSaveAll(){
  if(ssSaving || !INDEX) return;
  ssSaving = true;
  var btn = $('offlineSaveBtn');
  btn.textContent = '保存中…';
  var total = INDEX.stories.length, done = 0, failed = 0;
  var aaSet = {};
  var queue = INDEX.stories.map(function(st){ return st.id; });
  function worker(){
    if(!queue.length) return Promise.resolve();
    var id = queue.shift();
    return ssEnsureText(id).then(function(doc){
      if(doc){ done++; (doc.aa || []).forEach(function(e){ if(e && e.img) aaSet[e.img] = true; }); }
      else failed++;
      if((done + failed) % 20 === 0 || done + failed === total) ssProg('本文を保存中 ' + (done + failed) + ' / ' + total + ' 件（失敗 ' + failed + '）');
    }).then(worker);
  }
  var ws = [];
  for(var i = 0; i < 4; i++) ws.push(worker());
  Promise.all(ws).then(function(){
    var imgs = Object.keys(aaSet);
    var atotal = imgs.length, adone = 0, afailed = 0;
    var aq = imgs.slice();
    function aworker(){
      if(!aq.length) return Promise.resolve();
      var img = aq.shift();
      return ssEnsureBin('data/' + img).then(function(ok){
        if(ok) adone++; else afailed++;
        if((adone + afailed) % 20 === 0 || adone + afailed === atotal) ssProg('AA画像を保存中 ' + (adone + afailed) + ' / ' + atotal + ' 枚（失敗 ' + afailed + '）');
      }).then(aworker);
    }
    var aws = [];
    for(var j = 0; j < 4; j++) aws.push(aworker());
    return Promise.all(aws).then(function(){ return { atotal:atotal, adone:adone, afailed:afailed }; });
  }).then(function(res){
    ssSaving = false;
    btn.textContent = '全件保存する';
    ssProg('');
    INDEX.stories.forEach(function(st){ ssMarkSaved(st.id); });
    ssRefreshSavedIds();
    ssRenderStatus('保存が終わった。本文 ' + done + ' / ' + total + ' 件、AA画像 ' + res.adone + ' / ' + res.atotal + ' 枚。');
  });
}

/* ============ ss22：データ移行・世代管理・リーダーの保存・保存済みタブ ============ */
function ssMarkSaved(id){
  var m = loadObj('ss.savedAt.v1') || {};
  m[id] = Date.now();
  saveObj('ss.savedAt.v1', m);
}
/* ss21 の版つきデータ cache があれば、中身を ss-data-v1 へ移してから消す（代表の保存分を版上げで消さない） */
function ssMigrate(){
  if(!('caches' in window)) return Promise.resolve();
  var done = false;
  try{ done = !!localStorage.getItem('ss.mig.v1'); }catch(e){}
  if(done) return Promise.resolve();
  var finish = function(){ try{ localStorage.setItem('ss.mig.v1', '1'); }catch(e){} };
  return caches.keys().then(function(names){
    var old = null;
    names.forEach(function(n){ if(/^ss-data-2026-/.test(n)) old = n; });
    if(!old){ finish(); return; }
    return caches.open(old).then(function(oc){
      return oc.keys().then(function(keys){
        if(!keys.length){ finish(); return caches.delete(old); }
        return ssOpenCache().then(function(nc){
          /* 新側に索引だけ先にある場合でも、旧側の本文は新側に無い。全件写してから旧を消す */
          var chain = Promise.resolve();
          for(var i = 0; i < keys.length; i += 100){
            (function(batch){
              chain = chain.then(function(){
                return Promise.all(batch.map(function(k){
                  return oc.match(k).then(function(resp){ if(resp) return nc.put(k, resp); });
                }));
              });
            })(keys.slice(i, i + 100));
          }
          return chain.then(function(){ finish(); return caches.delete(old); });
        });
      });
    });
  }).catch(function(){});
}
/* 索引の取得：ネット優先。データが再生成されていたら古い保存を入れ替える */
function fetchIndexJson(){
  var path = 'data/index.json';
  return fetch(path + '?ts=' + Date.now(), { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(idx){
    var gen = String(idx.generated_at || '');
    var prev = null;
    try{ prev = localStorage.getItem('ss.dataGen'); }catch(e){}
    if(gen){ try{ localStorage.setItem('ss.dataGen', gen); }catch(e){} }
    var putBack = function(){
      ssOpenCache().then(function(c){
        var resp = new Response(JSON.stringify(idx), { headers:{ 'Content-Type':'application/json' } });
        return c.put(ssKey(path), resp);
      }).catch(function(){});
    };
    if(prev && gen && prev !== gen){
      ssOpenCache().then(function(c){
        return c.keys().then(function(keys){
          return Promise.all(keys.map(function(k){ return c.delete(k); }));
        });
      }).then(putBack).catch(function(){});
    } else {
      putBack();
    }
    return idx;
  }).catch(function(err){
    return ssOpenCache().then(function(c){ return c.match(ssKey(path)); }).then(function(hit){
      if(hit) return hit.json();
      throw err;
    });
  });
}
/* 1話の保存状態（本文の有無と AA 画像の揃い） */
function ssStoryState(id){
  return ssOpenCache().then(function(c){
    return c.match(ssKey('data/texts/' + encodeURIComponent(id) + '.json')).then(function(hit){
      if(!hit) return { text:false, aaTotal:0, aaHave:0 };
      return hit.json().then(function(doc){
        var imgs = {};
        (doc.aa || []).forEach(function(e){ if(e && e.img) imgs[e.img] = true; });
        var list = Object.keys(imgs);
        if(!list.length) return { text:true, aaTotal:0, aaHave:0 };
        return Promise.all(list.map(function(img){
          return c.match(ssKey('data/' + img)).then(function(h){ return h ? 1 : 0; });
        })).then(function(rs){
          var have = 0;
          rs.forEach(function(x){ have += x; });
          return { text:true, aaTotal:list.length, aaHave:have };
        });
      }).catch(function(){ return { text:true, aaTotal:0, aaHave:0 }; });
    });
  }).catch(function(){ return { text:false, aaTotal:0, aaHave:0 }; });
}
var ssSavingStory = false;
function ssUpdateSaveBtn(){
  var btn = $('saveBtn');
  if(!btn || !cur) return;
  ssStoryState(cur.story.id).then(function(st){

    btn.textContent = full ? '保存済み' : '保存する';
    btn.classList.toggle('on', full);

}
function ssSaveCurrent(){
  if(!cur || ssSavingStory) return;
  ssSavingStory = true;
  var btn = $('saveBtn');
  var id = cur.story.id;
  btn.textContent = '保存中…';
  fetchJson('data/texts/' + encodeURIComponent(id) + '.json').then(function(doc){
    var imgs = {};
    ((doc && doc.aa) || []).forEach(function(e){ if(e && e.img) imgs[e.img] = true; });
    var list = Object.keys(imgs);
    var i = 0;
    function next(){
      if(i >= list.length) return Promise.resolve();
      var img = list[i++];
      if(list.length > 1) btn.textContent = '保存中 ' + i + '/' + list.length;
      return ssEnsureBin('data/' + img).then(next);
    }
    return next();
  }).then(function(){
    ssSavingStory = false;
    ssMarkSaved(id);
    ssUpdateSaveBtn();
    ssRenderStatus();
    ssRefreshSavedIds();
  }).catch(function(){
    ssSavingStory = false;
    btn.textContent = '保存する';
  });
}

/* 保存済みタブ */
var ssSavedIds = {};
var ssTab = 'shelf';
function ssRefreshSavedIds(){

function ssRenderSaved(){

  if(!host || !INDEX) return;

  var list = INDEX.stories.filter(function(st){ return ssSavedIds[st.id]; });
  list.sort(function(a, b){

    if(ta !== tb) return ta - tb;

  });

    return;
  }
  var frag = document.createDocumentFragment();
  list.slice(0, 200).forEach(function(st){
    var wrap = storyNode(st);
    var del = document.createElement('button');
    del.className = 'mini gray';
    del.style.margin = '2px 0 10px';
    del.textContent = 'この話の保存を消す';
    del.addEventListener('click', function(){ ssDeleteStory(st.id); });
    wrap.appendChild(del);
    frag.appendChild(wrap);
    ssStoryState(st.id).then(function(state){
      if(state.text && state.aaTotal > state.aaHave && wrap.isConnected){
        var note = document.createElement('div');
        note.className = 'small';
        note.style.margin = '0 6px 4px';
        note.textContent = 'AA画像が未保存（' + state.aaHave + ' / ' + state.aaTotal + '）。開いて「保存」を押すと揃う。';
        wrap.appendChild(note);
      }
    });
  });
  host.appendChild(frag);
  if(list.length > 200){
    var more = document.createElement('div');
    more.className = 'countLine';
    more.textContent = '先頭 200 件を表示中（全 ' + list.length + ' 件）';
    host.appendChild(more);
  }
}
function ssDeleteStory(id){
  ssOpenCache().then(function(c){
    var key = ssKey('data/texts/' + encodeURIComponent(id) + '.json');
    return c.match(key).then(function(hit){
      var imgs = [];
      var read = hit ? hit.json().then(function(doc){
        (doc.aa || []).forEach(function(e){ if(e && e.img) imgs.push(e.img); });
      }).catch(function(){}) : Promise.resolve();
      return read.then(function(){
        var dels = [c.delete(key)];
        imgs.forEach(function(img){ dels.push(c.delete(ssKey('data/' + img))); });
        return Promise.all(dels);
      });
    });
  }).then(function(){
    var m = loadObj('ss.savedAt.v1') || {};
    delete m[id];
    saveObj('ss.savedAt.v1', m);
    ssRefreshSavedIds().then(function(){ ssRenderSaved(); ssRenderStatus(); });
  }).catch(function(){});
}
$('tabShelf').addEventListener('click', function(){ ssSwitchTab('shelf'); });
$('tabSaved').addEventListener('click', function(){ ssSwitchTab('saved'); });
ssMigrate().then(function(){ ssRenderStatus(); ssRefreshSavedIds(); });

$('offlineSaveBtn').addEventListener('click', ssSaveAll);
$('offlineDelBtn').addEventListener('click', function(){
  if(ssSaving) return;
  if(!('caches' in window)) return;
  caches.delete(SS_DATA_CACHE).then(function(){ ssProg(''); ssRenderStatus('保存を消した。'); });
});
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(function(reg){
    ssSwState = (reg.active || reg.installing || reg.waiting) ? '有効' : '登録中';
    ssRenderStatus();
  }).catch(function(){ ssSwState = '使えない環境'; ssRenderStatus(); });
}
ssRenderStatus();

/* ============ 開始 ============ */
loadIndex();
</script>
